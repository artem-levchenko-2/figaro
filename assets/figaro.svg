  <circle cx="48" cy="12" r="8" fill="url(#metal)"/>
  <rect x="18" y="19" width="60" height="14" rx="7" fill="url(#metal)"/>
  <g clip-path="url(#tube)">
    <rect x="20" y="28" width="56" height="104" fill="url(#stripes)"/>
    <rect x="20" y="28" width="56" height="104" fill="url(#glass)"/>
  </g>
  <rect x="27" y="32" width="42" height="96" rx="3" fill="none" stroke="#1f2433" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="18" y="127" width="60" height="14" rx="7" fill="url(#metal)"/>
  <path d="M40 141 h16 l-3 13 a5 5 0 0 1 -10 0 z" fill="url(#metal)"/>
