<svg xmlns="http://www.w3.org/2000/svg" width="96" height="160" viewBox="0 0 96 160" role="img" aria-label="Figaro">
  <defs>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <rect width="40" height="40" fill="#ffffff"/>
      <rect x="0" width="13" height="40" fill="#e5484d"/>
      <rect x="20" width="13" height="40" fill="#3e63dd"/>
    </pattern>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c98a12"/>
      <stop offset="0.35" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#b8770b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="0.28" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
