  if (v.latest) return { latest: v.latest, url: "", button: true };
  if (v.release && v.release.latest) return { latest: v.release.latest, url: v.release.url || "", button: false };
  return null;
}
const named = () => "Figaro" + (version ? " " + esc(version) : "");
const newerName = (to) => `<span class="ver-b">${named()} ${ICON.arrow} <span class="nv">${esc(to)}</span></span>`;

// A button with its hint over it (placeTips).
const tw = (button, tip) => `<span class="tw">${button}<span class="tip" role="tooltip">${tip}</span></span>`;
function tools() {
  const on = view === "settings";
  return '<span class="tools">'
    + tw(`<button type="button" class="tl${on ? " on" : ""}" data-act="gear" aria-label="${on ? "Close settings" : "Settings"}">${ICON.gear}</button>`,
      on ? "Close settings" : "Settings")
    + tw(`<button type="button" class="tl" data-act="min" aria-label="Minimize. Hold to nanomize">${ICON.shrink}${ICON.ring}</button>`,
      "Minimize. <kbd>Hold to nanomize</kbd>")
    + "</span>";
}

// The window's last line: the version, what there is to do about it, and the
// tools. A yellow ! says an update or a reload failed; why is in the settings.
function footer() {
  if (view === "mini" || view === "nano") return "";
  const v = versionNow();
  const reload = tw(`<button type="button" class="tl build" data-act="reload" aria-label="Reload">${ICON.again}</button>`,
    "Reload with the new build, once the scripts finish");
  // the new version's number is the button that installs it
  const upBtn = (to) => `<span class="ver-b">${named()} ${ICON.arrow} `
    + tw(`<button type="button" class="go upv" data-act="update" aria-label="Update to ${esc(to)}"><span>${esc(to)}</span>${ICON.down}</button>`,
      `Update to ${esc(to)}`) + "</span>";
  // a release the window can't install: its number links to its page, as in the settings
  const relLink = (to, url) => `<span class="ver-b">${named()} ${ICON.arrow} `
    + tw(`<button type="button" class="lnk vlnk" data-act="release" data-url="${esc(url || "")}"><span>${esc(to)}</span>${ICON.out}</button>`,
      "Open the release. <kbd>Update is off here</kbd>") + "</span>";
  // what failed, by the version: its why is in the settings
  const warnBtn = (tip) => tw(`<button type="button" class="tl warn" data-act="why" aria-label="${tip}. See why in the settings">${badge("caution")}</button>`, tip);
  const skipBtn = () => tw(`<button type="button" class="skip" data-act="skip" data-version="${esc(v.newer)}">Skip</button>`,
    "Hide until the next release");
  let left = named();
  if (v.doing) {
    left = `<span class="spin"></span><span class="txt">${v.doingText}</span>`;
  } else if (v.failed && v.failed.what === "reload") {
    left += warnBtn("Couldn't reload");
  } else if (v.failed && !v.away) {
    left = (v.newer ? newerName(v.newer) : named()) + warnBtn("Couldn't update") + (v.newer ? skipBtn() : "");
  } else if (v.latest && !v.away) {
    left = upBtn(v.latest) + skipBtn();
  } else if (v.on && stale()) {
    left += '<span class="nb">New build</span>' + reload;
  } else if (v.release && v.release.latest && !v.away) {
    left = relLink(v.release.latest, v.release.url) + skipBtn();
  }
  return `<div class="foot"><div class="line"><span class="ver">${left}</span>${tools()}</div></div>`;
}

// ─── the settings ────────────────────────────────────────────────────────
// What the window can change: the bridge keeps it for every window
// (~/.figaro/settings.json), over the FIGARO_* variables it started with.
const SETS = [
  ["sounds", "Sounds", "Buttons, minimize, Stop; a knock when Figma stops answering"],
  ["others", "Show other files", "Islands of your other Figma files where agents work. A file where Figma isn't answering shows anyway"],
  ["recent", "Show recent changes", "What agents changed lately, under each file's agents. A layer there selects it in Figma"],
  ["reviewer", "Reviewer", "A reviewer among each file's agents: it checks what agents change when they're done and shows you its notes. Off in every file until you turn it on"],
  ["versions", "Save versions as agents work", "Before an agent first changes a file, then hourly. Everyone with access sees them in its version history"],
];
function settingsView() {
  const can = conn === "ok" && !!(board && board.settings);
  const value = (k) => (board && board.settings ? board.settings[k] !== false : k === "sounds" ? !(board && !board.sounds) : true);
  // A bridge before the Recent switch doesn't know it: no switch, the list stays.
  // Likewise for the Reviewer: an older bridge has none, and no row.
  const known = ([k]) => (k !== "recent" && k !== "reviewer") || !board || !!(board.settings && k in board.settings);
  const sets = SETS.filter(known).map(([k, title, sub]) => {
    const on = value(k);
    return `<div class="set"><span class="t"><b>${title}</b><span>${sub}</span></span>`
      + `<button type="button" class="sw${on ? " on" : ""}" role="switch" aria-checked="${on}" aria-label="${title}" data-act="set" data-name="${k}"${can ? "" : " disabled"}></button></div>`;
  }).join("");
  const off = can ? "" : `<p class="sets-off">${conn !== "ok" ? "They can change once the bridge is up." : "Restart the bridge to change them: it runs an older Figaro."}</p>`;
  return `<div class="head"><button type="button" class="back" data-act="back" aria-label="Back to the files">${ICON.left}<span>Back</span></button></div>`
    + `<div class="slot"><div class="island">${sets}${off}</div></div>`
    + tokenCard()
    + versionCard();
}

// The Figma token, always open: lets agents read comments in Figma (and, later,
// see who changed a layer). The bridge keeps it on this computer; the window
// only ever knows its last four characters. A bridge before the token has no
// `figma` on its board, and the block isn't there.
const TOKEN_HELP = "https://help.figma.com/hc/en-us/articles/8085703771159-Manage-personal-access-tokens";
const TOKEN_WHY = {
  rejected: "Figma didn't accept this token. Check that you copied all of it and that it can read comments and file versions.",
  nofile: "Figma doesn't show this file to that token. Make the token in an account that can open the file.",
  open: "Open a Figma file where Figaro runs, then save the token: Figaro checks it on that file.",
  network: "Figma didn't answer. Check the connection and try again.",
  busy: "Figma is busy right now. Try again in a minute.",
};
let tokenDraft = "";           // what the field holds, kept across redraws
function tokenCard() {
  const fg = board && board.figma;
  if (!fg) return "";
  const title = '<b>Figma token<span class="opt">Optional</span></b>';
  const refused = !!(fg.token && fg.rejected);  // Figma turned the saved token down: it is replaced or removed
  if (fg.token && !refused) {
    tokenDraft = "";
    return '<div class="slot"><div class="island"><div class="set"><span class="t">' + title
      + `<span><span class="okc">Connected</span> · ${esc(fg.token)}. Agents can read comments and the version history of the files they work in</span></span>`
      + `<button type="button" class="go2" data-act="token-remove"${conn === "ok" ? "" : " disabled"}>Remove</button></div></div></div>`;
  }
  const checking = fg.check === "checking", failed = fg.check === "error";
  const can = conn === "ok" && !checking;
  const how = '<p class="help">In Figma: account menu → <b>Settings</b> → <b>Security</b> → <b>Generate new token</b>. '
    + `Let it read comments and file versions. <button type="button" class="lnk" data-act="release" data-url="${TOKEN_HELP}"><span>Figma help</span>${ICON.out}</button></p>`;
  const why = failed ? `<p class="help err">${TOKEN_WHY[fg.why] || TOKEN_WHY.rejected}</p>`
    : refused ? `<p class="help err">Figma no longer accepts the saved token, ${esc(fg.token)}. Paste a new one, or remove it.</p>` : "";
  const drop = refused ? `<button type="button" class="go2" data-act="token-remove"${conn === "ok" ? "" : " disabled"}>Remove</button>` : "";
  const save = checking
    ? '<button type="button" class="go" data-act="token-save" disabled><span class="spin"></span>Checking</button>'
    : `<button type="button" class="go" data-act="token-save"${can && tokenDraft.trim() ? "" : " disabled"}>Save</button>`;
  return '<div class="slot"><div class="island"><div class="set tok"><span class="t">' + title
    + "<span>Lets agents read comments in Figma and see who changed a layer and when</span></span>" + drop + "</div>"
    + `<div class="fld"><input class="inp${failed || refused ? " err" : ""}${checking ? " dim" : ""}" type="password" data-field="figma-token" placeholder="figd_…" `
    + `autocomplete="off" spellcheck="false" aria-label="Figma token" value="${esc(tokenDraft)}"${can ? "" : " disabled"}>${save}</div>`
    + why + how + '<p class="help last">Figaro keeps it on this computer only.</p></div></div>';
}

// The version: what to do about it, what is new, and where Figaro runs. A
// release the user skipped shows here all the same.
function versionCard() {
  const v = versionNow(), n = newestNow(v);
  let ind = '<span class="dot"></span>', name = named(), sub = "", right = "", note = "";
  if (!v.on) {
    ind = conn === "connecting" ? '<span class="spin idle"></span>' : '<span class="dot idle"></span>';
    sub = conn === "connecting" ? "connecting…" : "no bridge yet";
  } else if (v.doing) {
    ind = '<span class="spin"></span>';
    sub = v.doingText;
  } else if (n && n.button) {
    ind = badge("update");
    name = newerName(n.latest);
    right = `<button type="button" class="go" data-act="update" title="Download it, restart the bridge and reload the plugin, once the scripts finish">Update</button>`;
  } else if (n) {
    ind = badge("update");
    name = newerName(n.latest);
    right = `<button type="button" class="go2" data-act="release" data-url="${esc(n.url)}">Release${ICON.out}</button>`;
    note = '<p class="off-note">The Update button is off on this computer (<code>FIGARO_UPDATE_BUTTON=off</code>). '
      + "To update: <code>git pull</code> in the Figaro folder, restart the bridge, then press Reload.</p>";
  } else if (stale()) {
    ind = badge("build");
    sub = "new build";
    right = `<button type="button" class="go build" data-act="reload" title="Reload the plugin with the code on disk, once the scripts finish">Reload</button>`;
  } else if (board && !board.checks) {
    sub = "release check off";
  } else {
    const asking = checkAsked && !(board && board.checked >= checkAsked) && Date.now() - checkAsked < 15000;
    sub = asking ? "checking…" : board && board.checked ? "up to date · " + agoSpan(board.checked) : "up to date";
    right = asking ? '<span class="chk-up" aria-label="Checking"><span class="spin"></span></span>'
      : `<button type="button" class="chk-up" data-act="check" title="Check for a new release" aria-label="Check for a new release">${ICON.again}</button>`;
  }
  if (v.failed) {  // the alert has the button to try again
    ind = badge("caution");
    right = "";
    note = alertOf(v) + note;
  }
  const row = `<div class="row"><div class="tg"><span class="ind">${ind}</span><span class="lbl"><b>${name}</b>`
    + (sub ? `<span class="sub">${sub}</span>` : "") + "</span></div>" + (right ? `<div class="right">${right}</div>` : "") + "</div>";
  const notes = board && board.notes && board.notes.items.length
    ? `<div class="sect">What's new in ${esc(board.notes.version || version)}</div><ul class="notes">`
      + board.notes.items.map((t) => `<li>${esc(t)}</li>`).join("") + "</ul>" : "";
  const lnk = (act, text, extra, out) => `<button type="button" class="lnk" data-act="${act}"${extra}><span>${text}</span>${out ? ICON.out : ""}</button>`;
  const links = '<div class="lnks">' + lnk("release", "All release notes", ` data-url="${REPO}/releases"`, true)
    + (n && v.newer && !v.away ? lnk("skip", "Skip this release", ` data-version="${esc(v.newer)}"`, false)
      : lnk("release", "Report a problem", ` data-url="${REPO}/issues/new"`, true)) + "</div>";
  const kv = [];
  if (v.on && version) kv.push(["Bridge", `${esc(version)}, on localhost:8788`]);
  if (identity.pluginVersion) kv.push(["Plugin", "build " + esc(identity.pluginVersion)]);
  if (v.on && board && board.folder) kv.push(["Folder", esc(board.folder)]);
  const facts = kv.length ? '<div class="kv">' + kv.map(([k, x]) => `<b>${k}</b><span>${x}</span>`).join("") + "</div>" : "";
  return `<div class="slot"><div class="island open">${row}<div class="panel">${note}${notes}${links}${facts}</div></div></div>`;
}

// What failed, in plain words, with the button to try again in its corner;
// after the words, a copy of it for an agent, with what the agent needs to
// look into it.
const WHY = {
  "local changes": "The Figaro folder has changes of its own, so it can't move to the new release.",
  "local commits": "The Figaro folder has commits of its own that the release doesn't have.",
  "no remote": "The Figaro folder doesn't know where to get releases from.",
  "offline": "GitHub didn't answer. Check the connection and try again.",
  "git failed": "Git stopped with an error.",
  "not a git clone": "The Figaro folder isn't a git clone, so it can't update itself.",
  "no such release": "GitHub doesn't have this release.",
  "pip failed": "The new Python packages didn't install.",
  "files stayed busy": "Agents kept running scripts for 10 minutes. Try again once they're done.",
  "nothing new": "The Figaro folder already has this release.",
  "restart by hand": "The bridge didn't restart: run start-bridge.sh in the Figaro folder.",
  "unexpected error": "Something went wrong in the bridge.",
};
let copied = 0;                // when the error was copied for an agent (less than 0: it couldn't be)
const COPIED_MS = 1600;
function alertOf(v) {
  const f = v.failed, reload = f.what === "reload";
  const title = reload ? "Couldn't reload" : `Couldn't update${v.latest ? " to " + esc(v.latest) : ""}`;
  const shown = Date.now() - Math.abs(copied) < COPIED_MS ? (copied > 0 ? "done" : "no") : "";
  const copy = tw(`<button type="button" class="tl cp${shown === "done" ? " done" : ""}" data-act="copy" aria-label="Copy the error for your agent">`
    + `${shown === "done" ? ICON.done : ICON.copy}</button>`, shown === "done" ? "Copied" : shown === "no" ? "Couldn't copy: Figma didn't let it" : "Copy the error for your agent");
  const again = reload ? (stale() ? '<button type="button" class="go build" data-act="reload">Reload</button>' : "")
    : v.latest ? '<button type="button" class="go" data-act="update">Update</button>' : "";
  return `<div class="alert"><div class="al-h"><b>${title}</b>${again}</div>`
    + `<p>${esc(WHY[f.error] || f.detail || f.error)} ${copy}</p></div>`;
}
function errorText(v) {
  const f = v.failed;
  const what = f.what === "reload" ? "couldn't reload its plugin" : `couldn't update${v.latest ? " to " + v.latest : ""}`;
  return [`Figaro ${what} in Figma: ${f.error}.`, f.detail || null,
    `Figaro ${version || "(version unknown)"} on localhost:8788, plugin build ${identity.pluginVersion || "(unknown)"}`
      + (board && board.folder ? `, folder ${board.folder}` : "") + ".",
    "Explain what happened and fix it. `figaro doctor` shows Figaro's state."].filter(Boolean).join("\n");
}
// Figma doesn't let a plugin's window at navigator.clipboard, so first the old
// way, a selected text area, while the click still counts; the new one if that fails.
function copyText(text) {
  let ok = false;
  try {
    const t = document.createElement("textarea"), was = document.activeElement;
    t.value = text;
    t.setAttribute("readonly", "");
    t.style.position = "fixed";
    t.style.opacity = "0";
    document.body.appendChild(t);
    t.select();
    ok = document.execCommand("copy");
    t.remove();
    if (was && was.focus) was.focus();
  } catch (e) { ok = false; }
  if (ok) return Promise.resolve(true);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => false);
  } catch (e) { /* no way left */ }
  return Promise.resolve(false);
}
// ⚠ by the version opens the settings, at the alert.
function showAlert() {
  const el = app.querySelector && app.querySelector(".alert");
  if (!el || !scroller.getBoundingClientRect) return;
  const box = scroller.getBoundingClientRect(), r = el.getBoundingClientRect();
  const by = Math.min(r.bottom + 8 - box.bottom, r.top - box.top);
  if (by > 0) scroller.scrollBy({ top: by, behavior: calm() ? "auto" : "smooth" });
}

// ─── minimized ───────────────────────────────────────────────────────────
// Mini: the file that matters most — one where Figma stopped answering, or this
// one — with the count of the other files where agents are at work. Nano: an
// alarm anywhere, agents at work anywhere, or this file's state.
// Minimized, the window is this file's card, whatever the others do. Next to
// it (mini), how many other files have agents at work, or a red ! when Figma
// stopped answering in one of them; nano shows this file's state alone, and
// the grid while an agent works anywhere.
function miniView(nano, enter) {
  const files = filesNow().filter(shown);
  const top = files.find((f) => f.id === "here") || files[0];
  const h = headline(top);
  const restore = `<button type="button" class="tl" data-act="restore" title="Restore" aria-label="Restore">${ICON.grow}</button>`;
  const cls = "mini" + (nano ? " nano" : "") + (enter ? " enter" : "");
  if (nano) {
    const ind = h.alarm ? h.ind : files.some((f) => headline(f).kind === "working") ? LOADER : h.ind;
    return `<div class="${cls}"><div class="island${h.alarm ? " alarm" : ""}"><div class="row"><button type="button" class="tg" data-act="restore" title="Restore" aria-label="Restore">`
      + `<span class="ind">${ind}</span></button></div></div>${restore}</div>`;
  }
  const others = files.filter((f) => f !== top), red = others.filter(alarm);
  const more = others.filter((f) => headline(f).kind === "working").length;
  const side = red.length
    ? `<span class="mc alarm" title="Figma isn't answering in ${red.length > 1 ? red.length + " other files" : esc(red[0].name)}"><span class="ind">${headline(red[0]).ind}</span></span>`
    : more ? `<span class="mc" title="${more} more file${more > 1 ? "s" : ""} with agents at work">+${more}</span>` : "";
  return `<div class="${cls}"><div class="island${h.alarm ? " alarm" : ""}"><div class="row"><button type="button" class="tg" data-act="restore" title="Restore">`
    + `<span class="ind">${h.ind}</span><span class="lbl"><b>${esc(top.name)}</b></span></button></div></div>`
    + side + restore + "</div>";
}

// A hint is centred over its button; by the window's edge it slides in to stay
// 6 px inside, its tail still on the button.
function placeTips() {
  if (typeof document.querySelectorAll !== "function" || !document.documentElement) return;
  const width = document.documentElement.clientWidth;
  for (const t of document.querySelectorAll(".tw > .tip")) {
    const r = t.previousElementSibling.getBoundingClientRect(), box = t.parentElement.getBoundingClientRect();
    const cx = r.left + r.width / 2, w = t.offsetWidth;
    const left = Math.max(6, Math.min(width - 6 - w, cx - w / 2));
    t.style.left = left - box.left + "px";
    t.style.setProperty("--cx", cx - left + "px");
  }
}

// ─── rendering ───────────────────────────────────────────────────────────
// The window is drawn anew from its state. An island that appears grows in,
// one that goes away shrinks out; a redraw waits for those to finish (and for
// an island that opens or closes, its drive), and for a pressed button to be
// released, so it never swallows a click.
const app = document.getElementById("app");        // the islands
const scroller = document.getElementById("scroll");  // what scrolls them
const end = document.getElementById("end");        // the gap under the last island
const foot = document.getElementById("foot");      // the last line, at the window's bottom
const onScreen = new Set();    // islands on screen, by id
let lastFiles = new Map();
let animId = null;             // the island whose panel just opened
let ready = false;
let animUntil = 0;
let later = null;
let pressed = false;
let dirty = false;
let lastHtml = "";
let lastFoot = "";
let shutId = null;             // the island that just began to close
let lastSig = "";              // what the islands showed, apart from clocks: signature()
const ANIM_MS = 400;           // the longest animation: an island coming, going, opening, closing

function schedule() {
  if (pressed) { dirty = true; return; }
  const wait = drive || glide ? 32 : animUntil - Date.now();  // an island being driven, or a view coming in, is drawn anew once it is done
  if (wait > 0) {
    clearTimeout(later);
    later = setTimeout(schedule, wait);
    return;
  }
  render();
}

function render() {
  dirty = false;
  if (view !== "files") { renderView(); return; }
  const now = Date.now();
  for (const [key, at] of stopping) if (now - at > 3000) stopping.delete(key);  // the board says by then
  for (const [id, at] of closing) {
    if (now - at < ANIM_MS) continue;
    closing.delete(id);
  }
  lastSig = signature();
  const files = filesNow();
  const byId = new Map(files.map((f) => [f.id, f]));
  const opening = animId, shutting = shutId;
  let html = "";
  let moving = animId !== null || closing.size > 0;
  for (const f of files) {
    if (shown(f)) {
      const enter = ready && !onScreen.has(f.id);
      onScreen.add(f.id);
      html += island(f, enter ? " enter" : "", animId === f.id);
      moving = moving || enter;
    } else if (onScreen.has(f.id)) {
      onScreen.delete(f.id);
      html += island(f, " leave", false);
      moving = true;
    }
  }
  for (const id of [...onScreen]) {
    if (byId.has(id)) continue;
    onScreen.delete(id);  // its plugin closed: its island shrinks out
    const f = lastFiles.get(id);
    if (f) { html += island(f, " leave", false); moving = true; }
  }
  const tail = footer();
  lastFiles = byId;
  animId = null;
  shutId = null;
  ready = true;
  if (html !== lastHtml) {
    finishDrive();  // its island is drawn anew
    app.innerHTML = html;
    lastHtml = html;
    rvHint(null);  // its "?" may be gone
  }
  if (tail !== lastFoot) {
    foot.innerHTML = tail;
    lastFoot = tail;
    placeTips();
  }
  inStep();
  if (moving) {
    animUntil = Date.now() + ANIM_MS;
    clearTimeout(later);
    later = setTimeout(schedule, ANIM_MS);  // then without the animations' classes
  }
  if (opening !== null) startDrive(opening, true);
  else if (shutting !== null) startDrive(shutting, false);
  fit();
}

// The settings and the minimized views have no islands that come and go: they
// are drawn as they are. A minimized view springs in once.
function renderView() {
  const enter = Date.now() - viewSince < ANIM_MS;
  const html = view === "settings" ? settingsView() : miniView(view === "nano", enter && !calm());
  const tail = footer();
  const typing = document.activeElement;  // the token field keeps its place when the settings are drawn anew
  const caret = typing && typing.dataset && typing.dataset.field === "figma-token"
    ? { from: typing.selectionStart, to: typing.selectionEnd } : null;
  if (html !== lastHtml) {
    app.innerHTML = html;
    lastHtml = html;
    rvHint(null);
    const field = caret && tokenField();
    if (field && !field.disabled) {
      field.focus();
      if (field.setSelectionRange && caret.from !== null) field.setSelectionRange(caret.from, caret.to);
    }
  }
  if (tail !== lastFoot) {
    foot.innerHTML = tail;
    lastFoot = tail;
  }
  placeTips();
  inStep();
  if (enter) {
    animUntil = viewSince + ANIM_MS;
    clearTimeout(later);
    later = setTimeout(schedule, animUntil - Date.now());  // then without the class
  }
  fit();
}

// Every pixel grid and shimmer keeps one beat, however late it was drawn: their
// animations count from the page's start, not each from its own. After a
// redraw, and whenever one starts anew without one (a page that was hidden).
function inStep() {
  if (typeof document.getAnimations !== "function") return;
  for (const a of document.getAnimations()) {
    if ((a.animationName === "px" || a.animationName === "shim") && a.startTime !== 0) a.startTime = 0;
  }
}
document.addEventListener("animationstart", (e) => { if (e.animationName === "px" || e.animationName === "shim") inStep(); });

// The window follows its islands: it asks the sandbox (code.js) for the height
// of all of them and the line under them, and the sandbox puts it where that
// fits, moving it up when there is no room under it. It asks again every
// second, as Figma tells the sandbox nothing when the window moves. A window
// as tall as the canvas lets it get (`roomHeight`, from the sandbox) scrolls
// its islands.
const HEIGHT_MAX = 2000;       // code.js's
let sentHeight = 0;
let sentWidth = 0;
let roomHeight = Infinity;
const tall = (el) => el.getBoundingClientRect().height;
const contentHeight = () => scroller.getBoundingClientRect().top + tall(app) + tall(end) + tall(foot);
function ask(height) {
  sentHeight = height;
  sentWidth = WIDTHS[view];
  parent.postMessage({ pluginMessage: { type: "resize", height, width: sentWidth } }, "*");
}
function fit(again) {
  if (!app.getBoundingClientRect || drive || glide) return;  // a drive or a glide asks for itself
  const want = Math.ceil(contentHeight());
  edges();
  if (want > 0 && (again || want !== sentHeight || WIDTHS[view] !== sentWidth)) ask(want);
}
if (typeof ResizeObserver === "function") {
  const watch = new ResizeObserver(() => { fit(); placeTips(); });
  for (const el of [app, end, foot, scroller]) watch.observe(el);
}
// Figma sizes the window after the page has laid itself out: its hints go by the window's edges then.
if (typeof window.addEventListener === "function") window.addEventListener("resize", placeTips);

// An island that opens or closes doesn't animate by the clock alone: Figma
// moves the window's edges a frame or two after it asks. So every frame the
// window asks for its next height along the island's curve (the CSS's), and
// the island's fold takes whatever height Figma has given the window by then.
// The islands fill the window all the way, whichever edge Figma moves — the
// bottom one, or the top one when the window has no room under it: nothing
// under the island is cut off and nothing floats. When the window can't grow
// as much as the fold (the canvas is too short for it), the fold goes on past
// the window's bottom and the islands scroll; when the window can't change
// at all, the fold follows the clock.
const OPEN = { ms: 360, ease: bezier(.45, 0, .2, 1) };   // .island.opening .fold
const SHUT = { ms: 300, ease: bezier(.4, 0, .2, 1) };    // .island.closing .fold
const LATE_MS = 250;           // Figma never got the window there: the fold gets there anyway
let drive = null;
function bezier(x1, y1, x2, y2) {  // CSS's cubic-bezier(): its y at x
  const at = (a, b, t) => ((1 - 3 * b + 3 * a) * t + 3 * b - 6 * a) * t * t + 3 * a * t;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 20; i++) {
      t = (lo + hi) / 2;
      if (at(x1, x2, t) < x) lo = t; else hi = t;
    }
    return at(y1, y2, t);
  };
}
function startDrive(id, opening) {
  finishDrive();
  if (calm() || typeof requestAnimationFrame !== "function" || !app.getBoundingClientRect) return;
  const slot = [...app.querySelectorAll(".slot")].find((el) => el.dataset.fid === id);
  const isl = slot && slot.querySelector(".island");
  const fold = isl && isl.querySelector(".fold");
  if (!fold || !fold.firstElementChild) return;
  const full = Math.ceil(fold.firstElementChild.scrollHeight);
  const from = opening ? 0 : full, to = opening ? full : 0;
  isl.classList.add("driven");
  fold.style.height = from + "px";
  const h0 = window.innerHeight;
  const h1 = Math.max(1, Math.min(Math.ceil(contentHeight()) + to - from, roomHeight, HEIGHT_MAX));
  const t0 = performance.now();
  // a window that changes much less than the fold (it can barely grow) leaves the fold to the clock
  const byFrame = Math.abs(h1 - h0) >= Math.max(8, Math.abs(to - from) / 4);
  drive = { fold, from, to, h0, h1, t0, byFrame, curve: opening ? OPEN : SHUT, sent: 0 };
  step(t0);
  const tick = (now) => { if (drive && drive.t0 === t0) { step(now); requestAnimationFrame(tick); } };
  requestAnimationFrame(tick);
  setTimeout(() => { if (drive && drive.t0 === t0) finishDrive(); }, drive.curve.ms + LATE_MS + 100);
}
function step(now) {
  const d = drive;
  const t = Math.min(1, (now - d.t0) / d.curve.ms);
  const e = d.curve.ease(t);
  let q = d.byFrame ? (window.innerHeight - d.h0) / (d.h1 - d.h0) : e;
  q = now - d.t0 > d.curve.ms + LATE_MS ? 1 : Math.max(0, Math.min(1, q));
  d.fold.style.height = Math.floor(d.from + (d.to - d.from) * q) + "px";
  edges();
  if (q >= 1 && t >= 1) { finishDrive(); return; }
  const next = Math.round(d.h0 + (d.h1 - d.h0) * e);
  if (next !== d.sent) { d.sent = next; ask(next); }
}
function finishDrive() {
  if (!drive) return;
  const d = drive;
  drive = null;
  d.fold.style.height = d.to + "px";
  fit(true);
}

// An island that the list's top edge cuts gets round corners there; one that
// its bottom edge cuts fades out, as does the line with the version at the
// list's end. Between two islands an edge needs neither.
function edges() {
  if (!scroller.classList || !scroller.getBoundingClientRect) return;
  const box = scroller.getBoundingClientRect();
  const cut = (r) => r.top < box.bottom - 0.5 && r.bottom > box.bottom + 0.5;
  let up = false, down = false;
  for (const el of app.querySelectorAll(".slot")) {
    const r = el.getBoundingClientRect();
    up = up || (r.top < box.top - 0.5 && r.bottom > box.top + 0.5);
    down = down || cut(r);
  }
  down = down || cut(end.getBoundingClientRect());
  scroller.classList.toggle("up", up);
  scroller.classList.toggle("down", down);
}
// The scrollbar shows while the list scrolls, and for a moment after (and
// while the pointer is on the list: the CSS).
let still = null;
function scrolled() {
  edges();
  scroller.classList.add("moving");
  clearTimeout(still);
  still = setTimeout(() => scroller.classList.remove("moving"), 900);
}
if (scroller.addEventListener) scroller.addEventListener("scroll", scrolled, { passive: true });

// An island that opened, once it has: the list scrolls to show as much of it
// as fits, its row still in view.
function reveal(id) {
  const slot = open.has(id) && [...app.querySelectorAll(".slot")].find((el) => el.dataset.fid === id);
  if (!slot || !scroller.getBoundingClientRect) return;
  const box = scroller.getBoundingClientRect();
  const r = slot.getBoundingClientRect();
  const by = Math.min(r.bottom - box.bottom, r.top - box.top);
  if (by > 0) scroller.scrollBy({ top: by, behavior: calm() ? "auto" : "smooth" });
}

// ─── the buttons ─────────────────────────────────────────────────────────
function act(name, fid, el) {
  const f = fid ? filesNow().find((x) => x.id === fid) : null;
  if (name === "toggle" && f) {
    cue(open.has(f.id) ? "close" : "open");
    if (open.has(f.id)) {
      open.delete(f.id);
      if (!calm()) { closing.set(f.id, Date.now()); shutId = f.id; }
    } else {
      open.add(f.id);
      closing.delete(f.id);
      animId = f.id;
      setTimeout(() => reveal(f.id), ANIM_MS + 60);  // the window may have grown by then
    }
    render();
  } else if (name === "stop" && f && f.doc && el.dataset.agent) {
    cue("stop");
    stopping.set(f.doc + "\n" + el.dataset.agent, Date.now());
    send({ type: "stop", doc: f.doc, agent: el.dataset.agent });
    render();
  } else if (name === "update") {
    cue("go");
    send({ type: "update-now" });
  } else if (name === "reload") {
    cue("go");
    send({ type: "reload-all" });
  } else if (name === "skip" && el.dataset.version) {
    cue("skip");
    skipped = el.dataset.version;
    send({ type: "skip", version: skipped });
    render();
  } else if (name === "release") {
    cue("layer");
    parent.postMessage({ pluginMessage: { type: "open-url", url: el.dataset.url } }, "*");
  } else if (name === "layer") {
    cue("layer");
    parent.postMessage({ pluginMessage: { type: "select", id: el.dataset.id } }, "*");
  } else if (name === "rv-toggle" && f && f.doc) {
    cue("go");
    send({ type: "reviewer", doc: f.doc, on: el.dataset.on === "1" });
  } else if (name === "rv-tick" && f && f.doc && rvOf(f)) {
    cue("layer");
    const off = rvUnticked(f, rvOf(f)), id = String(el.dataset.id);
    if (!off.delete(id)) off.add(id);
    render();
  } else if ((name === "rv-send" || name === "rv-fine") && f && f.doc && rvOf(f)) {
    cue("go");
    send({ type: "review-answer", doc: f.doc, send: name === "rv-fine" ? [] : rvTicked(f, rvOf(f)).map((n) => n.id), at: rvOf(f).stamp });
  } else if (name === "rv-all" && f && f.here && rvOf(f)) {
    cue("layer");
    const ids = [];
    for (const n of rvOf(f).notes) for (const l of n.layers) if (!ids.includes(l.id) && !goneLayers.has(l.id)) ids.push(l.id);
    if (ids.length) parent.postMessage({ pluginMessage: { type: "select", id: ids[0], ids } }, "*");
  } else if (name === "rv-copy" && f && f.doc && rvOf(f)) {
    cue("go");
    copyText(reviewerText(f, rvOf(f)));
  } else if (name === "gear") {
    cue(view === "settings" ? "back" : "gear");
    setView(view === "settings" ? "files" : "settings");
  } else if (name === "back") {
    cue("back");
    setView("files");
  } else if (name === "why") {
    cue("gear");
    setView("settings");
    setTimeout(showAlert, GLIDE.ms + 60);
  } else if (name === "copy" && versionNow().failed) {
    cue("layer");
    copyText(errorText(versionNow())).then((ok) => {
      copied = ok ? Date.now() : -Date.now();
      lastHtml = null;
      render();
      setTimeout(() => { lastHtml = null; schedule(); }, COPIED_MS + 20);
    });
  } else if (name === "min") {
    cue("min");
    setView("mini");
  } else if (name === "restore") {
    if (Date.now() - viewSince < 350) return;  // the second click of a double one on Minimize
    cue("max");
    setView("files");
  } else if (name === "set" && el.dataset.name && board && board.settings) {
    const key = el.dataset.name, on = board.settings[key] === false;
    board.settings[key] = on;  // at once; the bridge's board says it again
    if (key === "sounds") board.sounds = on;
    send({ type: "set", name: key, on });
    cue("layer");  // heard only once sounds are on
    el.classList.toggle("on", on);  // the switch slides, and the redraw that follows changes nothing
    el.setAttribute("aria-checked", String(on));
    lastHtml = settingsView();
  } else if (name === "token-save") {
    const token = tokenDraft.trim();
    if (!token || !board || !board.figma || (board.figma.token && !board.figma.rejected) || board.figma.check === "checking") return;
    cue("go");
    board.figma.check = "checking";  // at once; the bridge's board says how the check went
    board.figma.why = null;
    const here = filesNow().find((x) => x.id === "here");
    send({ type: "figma-token", token, doc: here && here.doc ? here.doc : undefined });
    render();
  } else if (name === "token-remove" && board && board.figma) {
    cue("layer");
    board.figma.token = null;
    board.figma.rejected = false;
    board.figma.check = null;
    send({ type: "figma-token-remove" });
    render();
  } else if (name === "ask-add") {
    cue("gear");
    setView("settings");
    setTimeout(focusToken, GLIDE.ms + 60);
  } else if (name === "ask-hide" && f && f.doc) {
    cue("back");
    send({ type: "ask-hide", doc: f.doc });
    const own = board && board.files.find((x) => x.doc === f.doc);
    if (own) own.ask = null;
    render();
  } else if (name === "check") {
    cue("layer");
    checkAsked = Date.now();
    send({ type: "check-update" });
    setTimeout(schedule, 15000);  // a bridge that never answers: ↻ comes back
    render();
  }
}

// The token field: what is typed is kept here, and Save follows it without a redraw.
function tokenField() {
  return app.querySelector ? app.querySelector('[data-field="figma-token"]') : null;
}
function focusToken() {
  const el = tokenField();

}
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el || !el.dataset || el.dataset.field !== "figma-token") return;
  tokenDraft = String(el.value || "");
  const save = app.querySelector ? app.querySelector('[data-act="token-save"]') : null;
  if (save) save.disabled = !tokenDraft.trim();
  lastHtml = settingsView();  // the redraw that follows changes nothing
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target && e.target.dataset && e.target.dataset.field === "figma-token") act("token-save", null, e.target);
});

// The pointer on an agent's row: the window is drawn anew from its state, so
// the new rows take `hot` from here, and a redraw neither drops the highlight
// nor plays its fade again.
function point(key) {
  if (key === hot) return;

    const slot = el.closest("[data-fid]");
    el.classList.toggle("hot", !!slot && slot.dataset.fid + "\n" + el.dataset.agent === key);
  }
}

const rvtip = document.getElementById("rvtip");

  if (!rvtip || !rvtip.classList) return;
  if (!el) { rvtip.classList.remove("on"); return; }
  rvtip.textContent = RV_HINT;
  const r = el.getBoundingClientRect(), width = document.documentElement.clientWidth || 320;
  const w = rvtip.offsetWidth || 232, h = rvtip.offsetHeight || 60;
  rvtip.style.left = Math.max(6, Math.min(width - 6 - w, r.left + r.width / 2 - w / 2)) + "px";

  rvHint(e.target && e.target.closest ? e.target.closest(".qm") : null);
  if (e.target && e.target.closest && e.target.closest(".tw")) placeTips();  // where it is now, before it shows
  const row = e.target && e.target.closest ? e.target.closest(".agent[data-agent]") : null;

});
document.addEventListener("pointerout", (e) => {
  if (hold && hold.el.contains(e.target) && !hold.el.contains(e.relatedTarget)) holdEnd(false);  // off Minimize: no minimize
  if (!e.relatedTarget) { point(""); inside(false); rvHint(null); }  // it left the window
});
const calm = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

document.addEventListener("click", (e) => {
  if (eatClick) { eatClick = false; return; }  // the press that ended a hold
  const grid = e.target && e.target.closest ? e.target.closest(".px") : null;
  if (grid && !grid.closest(".mini")) {  // the rainbow (see .px), not the island's toggle: the window's own, nothing goes to the bridge
    if (document.documentElement) document.documentElement.classList.toggle("rainbow");
    return;
  }
  const el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el || el.disabled) return;
  if (el.dataset.act === "min" && e.detail > 0) return;  // the pointer's: the hold decides

});
let pressTimer = null;
function release() {
  clearTimeout(pressTimer);
  if (!pressed) return;
  pressed = false;
  setTimeout(() => { if (dirty) schedule(); }, 0);  // after the click that follows
}
document.addEventListener("pointerdown", () => {
  pressed = true;

});
document.addEventListener("pointerup", release);
document.addEventListener("pointercancel", release);
document.addEventListener("pointermove", wakeCues, { passive: true });
document.addEventListener("pointerdown", wakeCues);

// Minimize: let go at once and the window minimizes; held for HOLD_MS (a ring

let hold = null;               // {el, timer, stop}

  const el = e.target && e.target.closest ? e.target.closest('[data-act="min"]') : null;

    cue("nano");
    setView("nano");
  }, HOLD_MS) };
});
// Let go, the press's click comes next, on whatever is under the pointer by
// then (nano's restore, or mini's card): it is eaten.
document.addEventListener("pointerup", (e) => {
  if (!hold && !held) return;
  if (hold) holdEnd(hold.el.contains(e.target));
  held = false;
  eatClick = true;
  setTimeout(() => { eatClick = false; }, 0);
});
document.addEventListener("pointercancel", () => holdEnd(false));

// Live clocks and "2m ago", and what changes with time alone: an agent quiet
// for activeFor is no longer at work, and one quiet for SHOW_FOR leaves its
// island.
function signature() {
  return filesNow().map((f) => [f.id, shown(f), headline(f).kind,
    agentsOf(f).map((a) => a.name + ":" + a.st).join()].join("|")).join("\n");
}
setInterval(() => {
  for (const el of app.querySelectorAll("[data-clock]")) el.textContent = clock(+el.dataset.clock);
  for (const el of app.querySelectorAll("[data-ago]")) el.textContent = el.dataset.long ? agoLong(+el.dataset.ago) : ago(+el.dataset.ago);
  if (signature() !== lastSig) schedule();
  fit(true);  // the window may have moved, or the canvas changed: the sandbox checks its place
}, 1000);

// ─── the bridge ──────────────────────────────────────────────────────────
function connect() {
  clearTimeout(reconnectTimer);
  try {
    ws = new WebSocket(SERVER);
  } catch (e) {
    log("[ws] new WebSocket failed: " + e.message);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    // A new bridge may have different code on disk; it says `outdated` and
    // `update` again at hello time, and sends its board.
    conn = "ok";
    failures = 0;
    outdated = false;
    update = null;
    board = null;
    shift = null;
    log("[ws] connected" + (identity.name ? ` as ${identity.name}` : ""));
    sendHello();
    // In case identity hasn't arrived from the plugin yet, ask for it.
    parent.postMessage({ pluginMessage: { type: "need-identity" } }, "*");
    schedule();
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) {
      log("[ws] bad message: " + err.message);
      return;
    }
    if (msg.type === "exec") {
      log(`[exec] ${shortId(msg.id)} code=${(msg.code || "").length}b`);
      local.set(msg.id, { agent: msg.agent || "agent", since: Date.now() });
      if (!board) schedule();
      // timeout rides along: h.ck() in code.js stops a run once it has passed.
      // So do agent, readOnly, checkpoint, quick, libs and images — every field
      // bridge_exec.exec_fields sends (tests/test_exec.py checks the list).
      toSandbox({
        type: "exec", id: msg.id, code: msg.code, timeout: msg.timeout,
        agent: msg.agent, readOnly: msg.readOnly, checkpoint: msg.checkpoint,
        quick: msg.quick, libs: msg.libs, images: msg.images });
    } else if (msg.type === "undo") {
      // Revert the last script — code.js decides whether that is safe.
      toSandbox({ type: "undo", id: msg.id, agent: msg.agent, force: msg.force });
    } else if (msg.type === "reload") {
      // New code.js and ui.html from disk; this window is replaced by it.
      toSandbox({ type: "reload", id: msg.id, code: msg.code, html: msg.html });
    } else if (msg.type === "ping") {
      // Liveness probe: the bridge sends this when another plugin instance
      // wants the slot. Answering keeps ours.
      try { ws.send(JSON.stringify({ type: "pong" })); } catch (e) {}
    } else if (msg.type === "abort") {
      // The bridge gave up on this run, or the user pressed Stop; code.js
      // marks it so h.ck() throws.
      parent.postMessage({ pluginMessage: { type: "abort", id: msg.id } }, "*");
    } else if (msg.type === "board") {
      const before = board;
      takeBoard(msg);
      hear(before, board);
      warmCues();
      schedule();
    } else if (msg.type === "update") {
      // A newer release (vX.Y.Z tag) than the bridge's VERSION; url = its release page.
      update = { latest: msg.latest, current: msg.current, url: msg.url };
      schedule();
    } else if (msg.type === "outdated") {
      outdated = true;
      log(`[outdated] running ${msg.running}, bridge has ${msg.expected}`);
      schedule();
    }
  };

  ws.onclose = () => {
    // The bridge holds one slot per open file, so a close is always transient:
    // bridge restart, or this tab's socket dropped. Just reconnect.
    failures++;
    conn = failures >= NO_BRIDGE_AFTER ? "nobridge" : "connecting";
    board = null;
    local.clear();
    stopping.clear();
    log("[ws] disconnected");
    hush();  // no bridge, no agents — let the Mac sleep
    reconnectTimer = setTimeout(connect, 2000);
    schedule();
  };
}

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === "identity") {
    identity = { fileKey: m.fileKey || null, name: m.name || null, docSig: m.docSig || null,
                 pluginVersion: m.pluginVersion || null, caps: m.caps || [] };
    log(`[id] file=${identity.name}`);
    sendHello();  // (re-)register this connection under the file name
    if (!viewTaken && m.view) {  // null: the sandbox hasn't read it yet, and says it again once it has
      viewTaken = true;
      if ((m.view === "mini" || m.view === "nano") && view === "files") { view = m.view; layWidth(); viewSince = 0; lastHtml = lastFoot = null; }
    }
    schedule();
    return;
  }
  if (m.type === "room") {  // how tall the sandbox lets the window get
    if (m.height > 0) roomHeight = m.height;
    return;
  }
  if (m.type === "selected") {
    if (m.ok) goneLayers.delete(m.id); else goneLayers.add(m.id);
    schedule();
    return;
  }
  if (m.type === "result" || m.type === "error") {
    if (running.delete(m.id) && audio) quietLater();
    if (local.delete(m.id) && !board) schedule();
  }
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log(`[drop] ws not open, ${m.type} id=${shortId(m.id)}`);
    return;
  }
  try {
    if (typeof m.valueJson === "string") {
      // Already-serialized result: splice it in rather than parse + re-stringify.
      const { valueJson, ...rest } = m;
      ws.send(JSON.stringify(rest).slice(0, -1) + ',"value":' + valueJson + "}");
    } else {
      ws.send(JSON.stringify(m));
    }
  } catch (err) {
    log("[send] failed: " + err.message);
    return;
  }
  if (m.type === "result") log(`[ok]  ${shortId(m.id)}`);
  else if (m.type === "error") log(`[err] ${shortId(m.id)} ${m.text}`);
};

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
    log("[ws] tab visible again — reconnecting now");
    connect();
  }
});

parent.postMessage({ pluginMessage: { type: "need-identity" } }, "*");
render();
connect();
</script>
</body>
</html>
