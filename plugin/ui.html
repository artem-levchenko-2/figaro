<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* The plugin's window: one island per file where Figaro runs — this file
   first, then the others in the order they connected — and under them a line
   with the Figaro version. Figma draws the header above (40 px: the plugin's
   icon and name, the close button) and a 1 px line under it; the islands keep
   6 px from that line, or it reads as their border. They line up with the
   header: indicators and avatars on the icon's centre (x 24), names on the
   title's left edge (x 41), chevrons on the close button's centre (20 px from
   the right). Inside an island what starts 9 px from its left edge ends 9 px
   from its right one (x 15 to 305). The window's corners are 13 px and the
   islands sit 6 px in, so theirs are 13 − 6 = 7 px, and they are 6 px apart. */
* { box-sizing: border-box; }
:root {
  /* Figma's own window (themeColors), for what sits outside the islands */
  --win-bg: var(--figma-color-bg, #2c2c2c);
  --win-dim: var(--figma-color-text-secondary, rgba(255, 255, 255, .7));
  --win-faint: var(--figma-color-text-tertiary, rgba(255, 255, 255, .4));
  /* the islands: black in Figma's dark theme, white in its light one (below) */
  --is-bg: #0b0b0c;
  --is-edge: transparent;
  --is-text: #f4f4f6;
  --is-dim: rgba(244, 244, 246, .6);
  --is-faint: rgba(244, 244, 246, .38);
  --is-line: rgba(255, 255, 255, .08);
  --is-fill: rgba(255, 255, 255, .1);
  --is-fill-2: rgba(255, 255, 255, .18);
  --is-hover: rgba(255, 255, 255, .08);
  --is-tint: 32%;                /* how much of its colour a hovered button takes */
  --is-err: #ff8b74;
  --is-comp: #b58cff;
  --is-ink: #fff;                /* what a callout's code mixes its colour with */
  --ok: #14ae5c;
  --run: #0d99ff;
  --run-hover: #0b88e3;
  --wait: #ffb224;
  --err: #f24822;
  --build: #9747ff;
  --idle: #8e8e93;
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --sys-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* Figma's light theme (themeColors marks the page figma-light): white islands
   with a hairline edge on a grey-blue ground, the same layout. */
html.figma-light {
  --win-bg: #eef1f5;
  --win-dim: rgba(26, 32, 44, .68);
  --win-faint: rgba(26, 32, 44, .5);
  --is-bg: #ffffff;
  --is-edge: rgba(26, 32, 44, .12);
  --is-text: #1b1d22;
  --is-dim: rgba(26, 32, 44, .62);
  --is-faint: rgba(26, 32, 44, .48);
  --is-line: rgba(26, 32, 44, .09);
  --is-fill: rgba(26, 32, 44, .06);
  --is-fill-2: rgba(26, 32, 44, .1);
  --is-hover: rgba(26, 32, 44, .05);
  --is-tint: 16%;
  --is-err: #d23a1d;
  --is-comp: #8a55f5;
  --is-ink: #000;
}
html, body { margin: 0; background: var(--win-bg); overflow: hidden; }
body { font-family: var(--sys); -webkit-font-smoothing: antialiased; }
button { font: inherit; }
#app { padding: 6px; }

/* A slot grows and shrinks around its island as it comes and goes. */
.slot { display: grid; grid-template-rows: 1fr; }
.slot + .slot { margin-top: 6px; }
.slot.enter { animation: rise .34s cubic-bezier(.2, .8, .2, 1) backwards; }
.slot.enter > .island { animation: pop .34s cubic-bezier(.2, .8, .2, 1) backwards; }
.slot.leave { animation: sink .26s cubic-bezier(.4, 0, .8, .4) forwards; pointer-events: none; }
@keyframes rise { from { grid-template-rows: 0fr; margin-top: 0; opacity: 0; } }
@keyframes pop { from { transform: scale(.96); } }
@keyframes sink { to { grid-template-rows: 0fr; margin-top: 0; opacity: 0; } }
.island { --pad: 9px; --bpad: 4px; min-height: 0; overflow: hidden; border-radius: 7px; background: var(--is-bg); box-shadow: inset 0 0 0 1px var(--is-edge); color: var(--is-text); font-size: 12px; line-height: 16px; }
.row { height: 30px; display: flex; align-items: center; gap: 4px; padding-right: var(--bpad); }
.tg { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 0 0 var(--pad); border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.tg:focus-visible, .chev:focus-visible { outline: 2px solid var(--run); outline-offset: -2px; border-radius: 7px; }
.ind { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
.dot { --c: var(--ok); width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 24%, transparent); }
.spin { --c: var(--run); width: 12px; height: 12px; border: 2px solid color-mix(in srgb, var(--c) 24%, transparent); border-top-color: var(--c); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.chk { display: grid; color: var(--ok); }
.chk svg { width: 12px; height: 12px; }
.lbl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.lbl b { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.lbl .sub { flex: 0 4 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--is-dim); font-variant-numeric: tabular-nums; }
.right { flex: none; display: flex; align-items: center; gap: 4px; }
.ib { width: 18px; height: 18px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 9px; background: var(--is-fill); color: var(--is-text); cursor: pointer; }
.ib:hover { background: color-mix(in srgb, var(--err) var(--is-tint), transparent); color: var(--is-err); }
.ib:disabled { cursor: default; background: var(--is-fill); color: var(--is-faint); }
.sq { width: 7px; height: 7px; border-radius: 1.5px; background: currentColor; }
.ind .sq { color: var(--idle); }
.chev { width: 20px; height: 20px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--is-faint); cursor: pointer; }
.chev svg { width: 10px; height: 10px; }
.island.open .chev { transform: rotate(180deg); }

/* An island opens by growing its panel from nothing, pushing the islands under
   it down, and closes the same way back; the window follows it (fit). */
.fold { display: grid; grid-template-rows: 1fr; }
.fold > div { min-height: 0; overflow: hidden; }
.panel { padding-bottom: 5px; border-top: 1px solid var(--is-line); }
.island.opening .fold { animation: unfold .36s cubic-bezier(.45, 0, .2, 1) both; }
.island.opening .panel { animation: drop .36s cubic-bezier(.2, .8, .2, 1) both; }
.island.opening .chev { animation: chev-open .36s cubic-bezier(.45, 0, .2, 1); }
.island.closing .fold { animation: refold .3s cubic-bezier(.4, 0, .2, 1) forwards; }
.island.closing .panel { animation: lift .22s ease forwards; }
.island.closing .chev { animation: chev-close .3s cubic-bezier(.4, 0, .2, 1); }
.island.closing .sub { animation: appear .3s ease; }
@keyframes unfold { from { grid-template-rows: 0fr; } }
@keyframes refold { to { grid-template-rows: 0fr; } }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
@keyframes lift { to { opacity: 0; transform: translateY(-4px); } }
@keyframes chev-open { from { transform: rotate(0deg); } }
@keyframes chev-close { from { transform: rotate(180deg); } }
@keyframes appear { from { opacity: 0; } }
.sect { padding: 11px var(--pad) 3px; color: var(--is-faint); font-size: 10px; line-height: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.callout { --c: var(--idle); display: grid; gap: 4px; margin: 6px calc(var(--pad) - 6px) 0; padding: 6px 6px 8px; border-radius: 5px; background: color-mix(in srgb, var(--c) 13%, var(--is-bg)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) var(--is-tint), transparent); }
.callout .h { min-height: 18px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.callout p, .callout code { margin: 0 0 0 26px; }
.callout p { color: var(--is-dim); font-size: 11.5px; line-height: 16px; }
.callout code { color: color-mix(in srgb, var(--c) 45%, var(--is-ink)); font: 11px/15px var(--sys-mono); overflow-wrap: anywhere; }
/* An agent: its name, a little heavier than the text around it, and what it
   is doing, and under them the note it left (done), grey like the status, or
   the error its last script stopped at, in red. An agent at work shows its
   Stop while the pointer is on it, in a highlight 4 px in from the island's
   edges, with the avatar and the Stop 5 px in from its ends. The Stop makes
   room first and then appears; going, it fades first. */
.agent { margin: 0 calc(var(--pad) - 5px); padding: 0 5px; border-radius: 14px; }
.agent[data-agent] { transition: background-color .18s ease; }
.agent.hot, .agent.held { background: var(--is-hover); }
.ah { height: 28px; display: flex; align-items: center; gap: 8px; }
.av { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--av, #7b61ff); color: #fff; font-size: 10px; font-weight: 700; }
.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.st { flex: none; display: flex; align-items: center; gap: 6px; color: var(--is-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.st .dot { width: 6px; height: 6px; box-shadow: none; }
.st .spin { width: 10px; height: 10px; border-width: 1.5px; }
.st .chk svg { width: 10px; height: 10px; }
.st .sq { width: 6px; height: 6px; color: var(--is-faint); }
.act { flex: none; width: 0; height: 18px; margin-left: -8px; display: flex; justify-content: flex-end;
  transition: width .2s cubic-bezier(.4, 0, .2, 1) .05s, margin-left .2s cubic-bezier(.4, 0, .2, 1) .05s; }
.act .ib { flex: none; opacity: 0; transform: scale(.6); pointer-events: none; transition: opacity .1s ease, transform .14s ease; }
.hot .act, .held .act, .agent:focus-within .act { width: 18px; margin-left: -2px; transition-delay: 0s; transition-timing-function: cubic-bezier(.2, .8, .2, 1); }
.hot .act .ib, .held .act .ib, .agent:focus-within .act .ib { opacity: 1; transform: none; pointer-events: auto;
  transition: opacity .16s ease .06s, transform .22s cubic-bezier(.2, .8, .2, 1) .04s; }
.msg { margin: -4px 0 0; padding: 0 0 7px 26px; color: var(--is-dim); font-size: 11.5px; line-height: 15px; overflow-wrap: anywhere; }
.msg.err { color: var(--is-err); }
.feed { display: grid; padding-bottom: 2px; }
.ev { display: grid; grid-template-columns: 26px minmax(0, 1fr); padding: 5px var(--pad); }
.ev .t { color: var(--is-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.ev .s { min-width: 0; overflow-wrap: anywhere; }
.ev .s em { color: var(--is-dim); font-style: normal; }
.ev.err .s b { color: var(--is-err); }
.ev.stop .s b { color: var(--is-dim); }
.layers { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.layer { height: 20px; max-width: 100%; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px 0 5px; border: 0; border-radius: 5px; background: var(--is-fill); color: var(--is-text); font: 500 11px/1 var(--sys); }
button.layer { cursor: pointer; }
button.layer:hover { background: color-mix(in srgb, var(--run) var(--is-tint), transparent); }
.layer.gone { opacity: .45; }
.layer.gone span { text-decoration: line-through; }
.layer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer svg { width: 12px; height: 12px; flex: none; color: var(--is-dim); }
.layer.comp svg { color: var(--is-comp); }
.more { align-self: center; padding: 0 2px; color: var(--is-faint); font-size: 11px; }

/* The window's last line, under the islands: the Figaro version, always, and on
   the right a newer release to update to (or, where the bridge has no Update
   button, a link to it), the update under way, or newer plugin code to
   reload. Its text keeps the islands' inner edges, x 15 to 305;
   a button runs out to their outer edge, x 314, so it is 6 px from the
   window's edge, as from the island above it and the window's bottom. Why an
   update failed takes a line of its own above it, its button staying on the
   last line. */
.foot { margin-top: 6px; color: var(--win-faint); font-size: 11px; font-weight: 500; }
.foot .line { height: 22px; display: flex; align-items: center; gap: 8px; padding: 0 9px; white-space: nowrap; }
.foot .ver { flex: none; }
.foot .what { margin-left: auto; min-width: 0; display: flex; align-items: center; gap: 6px; color: var(--win-dim); }
.foot .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.foot .spin { flex: none; width: 10px; height: 10px; border-width: 1.5px; }
.foot .why { display: flex; gap: 6px; padding: 3px 9px; color: var(--win-dim); line-height: 16px; overflow-wrap: anywhere; }
.foot .warn { flex: none; height: 16px; display: grid; place-items: center; color: var(--wait); }
.foot .warn svg { width: 12px; height: 12px; }
.go { flex: none; height: 22px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border: 0; border-radius: 11px; background: var(--run); color: #fff; font: 600 11px/1 var(--sys); cursor: pointer; }
.go:hover { background: var(--run-hover); }
.go svg { width: 10px; height: 10px; margin-left: -1px; }
.go.build { background: var(--build); }
.go.build:hover { background: color-mix(in srgb, var(--build) 85%, #000); }
.foot .go { margin-right: -9px; }
.foot .out { flex: none; display: inline-flex; align-items: center; gap: 3px; padding: 0; border: 0; background: none; color: var(--win-dim); font: inherit; cursor: pointer; }
.foot .out span { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 2px; }
.foot .out:hover span { text-decoration-color: currentColor; }
.foot .out svg { width: 9px; height: 9px; }

@media (prefers-reduced-motion: reduce) {
  .slot.enter, .slot.enter > .island, .slot.leave, .island.opening :is(.fold, .panel, .chev) { animation: none; }
  .agent[data-agent], .act, .act .ib { transition: none; }
  .spin { animation-duration: 2.4s; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
const SERVER = "ws://localhost:8788/plugin";
let ws = null;
let reconnectTimer = null;
let identity = { fileKey: null, name: null, docSig: null, pluginVersion: null, caps: [] };

function sendHello() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    ws.send(JSON.stringify({
      type: "hello", version: "2.1", plugin: identity.pluginVersion,
      fileKey: identity.fileKey, name: identity.name, docSig: identity.docSig,
      caps: identity.caps,  // what the sandbox can do beyond exec
      awake: awakeState(),
    }));
  } catch (e) {}
}

// A button's message to the bridge: stop, update-now, reload-all.
function send(msg) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try { ws.send(JSON.stringify(msg)); } catch (e) {}
}

// ─── keep-awake ──────────────────────────────────────────────────────────
// Chromium throttles a Figma window that is in the background: its timers and
// Figma's own `documentchange` reports slow to about once a minute, so a loop
// of `await figma.loadFontAsync` stalls ~50 s per call and changes arrive long
// after the script ended. A page that plays sound is never throttled, so while
// agents work this window plays a 20 Hz tone at -66 dBFS: nobody hears it, and
// Chromium counts it as sound (a silent stream does not count). After
// AWAKE_IDLE_MS without a script it stops, because a playing page also keeps
// macOS from idle sleep, and it stops at once when the bridge goes away: it
// plays only while the bridge is up (tests/ui.test.js).
const AWAKE_IDLE_MS = 3 * 60 * 1000;
const AWAKE_SETTLE_MS = 250;  // until Chromium notices the sound and lifts throttling
const AWAKE_RESUME_MS = 500;  // a page not allowed to play sound never resumes — don't wait for it
let audio = null;
let awakeSince = 0;
let awakeTimer = null;

function awakeState() {
  if (!audio) return "off";
  return audio.state === "running" ? "on" : audio.state;
}

// Start (or keep) the tone; resolves once the window has had time to wake up.
function wake() {
  clearTimeout(awakeTimer);
  awakeTimer = setTimeout(hush, AWAKE_IDLE_MS);
  try {
    if (!audio) {
      audio = new AudioContext();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = 20;
      gain.gain.value = 0.0005;
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
    }
    if (audio.state === "running" && awakeSince) {
      const left = awakeSince + AWAKE_SETTLE_MS - Date.now();
      return left > 0 ? new Promise((r) => setTimeout(r, left)) : null;
    }
    const resumed = audio.resume().then(() => true, (e) => { log("[awake] " + e.message); return false; });
    const late = new Promise((r) => setTimeout(() => r(false), AWAKE_RESUME_MS));
    return Promise.race([resumed, late]).then((ok) => {
      if (!ok || audio.state !== "running") return null;  // no sound: run the script as is
      awakeSince = Date.now();
      return new Promise((r) => setTimeout(r, AWAKE_SETTLE_MS));
    });
  } catch (e) {
    log("[awake] " + e.message);
    return null;
  }
}

// Stop the tone: no script for AWAKE_IDLE_MS, or the bridge is gone.
function hush() {
  clearTimeout(awakeTimer);
  if (audio) audio.suspend();
  awakeSince = 0;
}

// Hand a request from the bridge to the sandbox once the window is awake.
function toSandbox(msg) {
  const ready = wake();
  const send = () => parent.postMessage({ pluginMessage: msg }, "*");
  if (ready) ready.then(send, send); else send();
}

// For debugging via the plugin console.
function log(line) {
  console.log("[figaro] " + line);
}

function shortId(id) {
  return id ? String(id).slice(0, 8) : "?";
}

// ─── what the window knows ───────────────────────────────────────────────
const SHOW_FOR = 60 * 60 * 1000;  // an agent's row goes an hour after it was last at work
const NO_BRIDGE_AFTER = 3;        // failed connects in a row before "no bridge yet"

let conn = "connecting";       // connecting | ok | nobridge
let failures = 0;
let board = null;              // the bridge's last `board`, its times on this window's clock
let shift = null;              // this window's clock minus the bridge's, in ms
let activeFor = 300 * 1000;    // an agent is at work this long after its last script; the board says
let update = null;             // a newer release, from a bridge without boards
let version = "";              // the bridge's Figaro version, kept while it reconnects
let outdated = false;          // the bridge has newer plugin code than this window runs
const local = new Map();       // exec id -> {agent, since}: for a bridge without boards
const open = new Set();        // the islands that are open, by id
const closing = new Map();     // id -> when it began to close: its panel folds away first
let hot = "";                  // the agent row the pointer is on: island id + "\n" + agent
const stopping = new Map();    // doc + "\n" + agent -> when the user pressed its Stop
const goneLayers = new Set();  // Recent layers that are no longer in the file

// The board's times are the bridge's clock in seconds; the window counts in its own.
function takeBoard(m) {
  if (shift === null) shift = Date.now() - m.now * 1000;
  const t = (s) => (typeof s === "number" ? s * 1000 + shift : 0);
  if (typeof m.active_for === "number") activeFor = m.active_for * 1000;
  if (m.version) version = m.version;
  board = {
    version: m.version || "", update: m.update || null, release: m.release || null, stale: !!m.stale,
    updating: m.updating || null, failed: m.failed || null,
    files: (m.files || []).map((f) => ({
      id: f.doc, doc: f.doc, sig: f.sig, name: f.name || "Untitled", here: false,
      agents: (Array.isArray(f.agents) ? f.agents : []).map((a) => ({
        name: a.name, since: t(a.since), last: t(a.last), busy: !!a.busy,
        done: a.done ? { text: a.done.text || "", at: t(a.done.at) } : null,
        stopped: typeof a.stopped === "number" ? t(a.stopped) : null,
        error: a.error ? { text: a.error.text || "", line: a.error.line, at: t(a.error.at) } : null,
      })),
      recent: (f.recent || []).map((e) => Object.assign({}, e, { at: t(e.at) })),
    })),
  };
}

// This file first, under the id "here", then the others as the bridge lists them.
function filesNow() {
  const here = { id: "here", doc: null, name: identity.name || "This file", here: true, agents: [], recent: [] };
  if (conn !== "ok" || !board) {
    // A bridge without boards: the scripts this window runs, while they run.
    const byName = new Map();
    if (conn === "ok") for (const x of local.values()) {
      if (!byName.has(x.agent)) byName.set(x.agent, { name: x.agent, since: x.since, last: x.since, busy: true, done: null, stopped: null, error: null });
    }
    here.agents = [...byName.values()];
    return [here];
  }
  let mine = null;
  const others = [];
  for (const f of board.files) {
    if (!mine && identity.docSig && f.sig === identity.docSig) {
      mine = Object.assign({}, f, { id: "here", here: true, name: identity.name || f.name });
    } else others.push(f);
  }
  return [mine || here].concat(others);
}

const stale = () => outdated || !!(board && board.stale);

// What an agent is doing: stopped by the user; done, as it said; at work while
// a script of its runs or waits, and for activeFor after its last one; then
// quiet — failed, if its last script failed.
function stateOf(a) {
  if (a.stopped !== null) return "stopped";
  if (a.done) return "done";
  if (a.busy || Date.now() - a.last < activeFor) return "working";
  return a.error ? "failed" : "idle";
}
const RANK = { working: 0, failed: 1, stopped: 2, done: 3, idle: 4 };
// A file's agents: those at work first, in the order they began, then the
// others, the latest first, for an hour.
function agentsOf(f) {
  const now = Date.now();
  return f.agents.map((a) => {
    const st = stateOf(a);
    return Object.assign({}, a, { st, at: st === "done" ? a.done.at : st === "stopped" ? a.stopped : a.last });
  }).filter((a) => a.st === "working" || now - a.at < SHOW_FOR)
    .sort((x, y) => RANK[x.st] - RANK[y.st] || (x.st === "working" ? x.since - y.since : y.at - x.at));
}
// Every file where Figaro runs has its island, quiet or not: the board lists
// the files whose plugin is connected. One whose plugin closes leaves.
function shown(f) {
  return f.here || conn === "ok";
}

// ─── drawing it ──────────────────────────────────────────────────────────
const PALETTE = ["#7b61ff", "#f2711c", "#12a594", "#e5489b", "#3e7bfa", "#b7791f"];
const ICON = {
  check: '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="6" fill="currentColor"/><path d="M3.5 6.2 5.2 7.9 8.5 4.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chev: '<svg viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  up: '<svg viewBox="0 0 10 10"><path d="M5 8.6V1.6M1.9 4.6 5 1.5l3.1 3.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  out: '<svg viewBox="0 0 10 10"><path d="M2.4 7.6 7.4 2.6M3.6 2.6h3.8v3.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4.2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.3" r=".95" fill="#fff"/></svg>',
  FRAME: '<svg viewBox="0 0 12 12"><path d="M4 1.5v9M8 1.5v9M1.5 4h9M1.5 8h9" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>',
  COMPONENT: '<svg viewBox="0 0 12 12"><path fill="currentColor" d="M6 .9 7.7 2.6 6 4.3 4.3 2.6zM6 7.7l1.7 1.7L6 11.1 4.3 9.4zM2.6 4.3 4.3 6 2.6 7.7.9 6zM9.4 4.3 11.1 6 9.4 7.7 7.7 6z"/></svg>',
  INSTANCE: '<svg viewBox="0 0 12 12"><path d="M6 1.3 10.7 6 6 10.7 1.3 6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
  TEXT: '<svg viewBox="0 0 12 12"><path d="M2.5 2.5h7M6 2.5v7.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
};

const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function color(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 45) return "now";
  const m = Math.round(s / 60);
  return m < 60 ? m + "m" : Math.round(m / 60) + "h";
}
const agoLong = (ts) => { const a = ago(ts); return a === "now" ? "just now" : a + " ago"; };
function clock(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const clockSpan = (ts) => `<span data-clock="${ts}">${clock(ts)}</span>`;
const agoSpan = (ts) => `<span data-ago="${ts}" data-long="1">${agoLong(ts)}</span>`;
const agoShort = (ts) => `<span data-ago="${ts}">${ago(ts)}</span>`;
const av = (name) => `<span class="av" style="--av: ${color(name)}">${esc(String(name)[0].toUpperCase())}</span>`;

// What a closed island shows: the file, then what matters most in it.
function headline(f) {
  if (f.here && conn === "connecting") return { kind: "connecting", ind: '<span class="spin" style="--c: var(--idle)"></span>', sub: "connecting…" };
  if (f.here && conn === "nobridge") return { kind: "nobridge", ind: '<span class="dot" style="--c: var(--idle)"></span>', sub: "no bridge yet" };
  const list = agentsOf(f);
  const working = list.filter((a) => a.st === "working");
  if (working.length) {
    const sub = working.length > 1 ? working.map((a) => esc(a.name)).join(", ") : esc(working[0].name) + " " + clockSpan(working[0].since);
    return { kind: "working", ind: '<span class="spin"></span>', sub };
  }
  const failed = list.find((a) => a.st === "failed");
  if (failed) return { kind: "failed", ind: '<span class="dot" style="--c: var(--err)"></span>', sub: esc(failed.name) + " failed" };
  const done = list.find((a) => a.st === "done");
  if (done) return { kind: "done", ind: `<span class="chk">${ICON.check}</span>`, sub: esc(done.name) + " is done" };
  const stopped = list.find((a) => a.st === "stopped");
  if (stopped) return { kind: "stopped", ind: '<span class="sq"></span>', sub: esc(stopped.name) + " stopped" };
  const last = f.recent[0];
  if (!last) return { kind: "ok", ind: '<span class="dot"></span>', sub: "" };
  return { kind: "ok", ind: '<span class="dot"></span>', sub: esc(last.agent) + " · " + agoSpan(last.at) };
}

// An open island lists everything below its row, so the row keeps only the file's name.
function row(f) {
  const h = headline(f);
  const isOpen = open.has(f.id);
  const right = `<button type="button" class="chev" data-act="toggle" aria-label="${isOpen ? "Collapse" : "Expand"}" tabindex="-1">${ICON.chev}</button>`;
  const sub = h.sub && !isOpen ? `<span class="sub">${h.sub}</span>` : "";
  return `<div class="row"><button type="button" class="tg" data-act="toggle" aria-expanded="${isOpen}">`
    + `<span class="ind">${h.ind}</span><span class="lbl"><b title="${esc(f.name)}">${esc(f.name)}</b>${sub}</span></button>`
    + `<div class="right">${right}</div></div>`;
}

function callout(f) {
  const h = headline(f);
  if (h.kind === "connecting") return `<div class="callout"><div class="h"><span class="ind">${h.ind}</span>Looking for the bridge</div><p>It runs on this computer and answers in a second or two.</p></div>`;
  if (h.kind === "nobridge") return `<div class="callout"><div class="h"><span class="ind">${h.ind}</span>Waiting for the bridge</div><p>It starts with your agent's first figaro command. To start it now, run <code>figaro doctor</code> in a terminal.</p></div>`;
  return "";
}

// An agent's row: what it is doing. One at work has its Stop, shown while the
// pointer is on the row (hot) and while the Stop is under way (held); another
// file's agents can be stopped too, as the bridge knows them all. The error
// of an agent's last script stays under its name, at work or not, until a
// script of its succeeds: Recent says "Script failed" meanwhile.
function agentRow(f, a) {
  let st, act = "", msg = "", cls = "agent", data = "";
  const err = a.error ? `<p class="msg err">${a.error.line ? `Line ${a.error.line}: ` : ""}${esc(a.error.text)}</p>` : "";
  if (a.st === "working") {
    st = `<span class="spin"></span>working ${clockSpan(a.since)}`;
    msg = err;
    if (f.doc) {
      const pressed = stopping.has(f.doc + "\n" + a.name);
      const tip = pressed ? "Stopping…" : "Stop " + a.name;
      act = `<span class="act"><button type="button" class="ib" data-act="stop" data-agent="${esc(a.name)}" title="${esc(tip)}" aria-label="${esc(tip)}"${pressed ? " disabled" : ""}><span class="sq"></span></button></span>`;
      data = ` data-agent="${esc(a.name)}"`;
      if (pressed) cls += " held";
      if (hot === f.id + "\n" + a.name) cls += " hot";
    }
  } else if (a.st === "done") {
    st = `<span class="chk">${ICON.check}</span>done · ${agoShort(a.at)}`;
    if (a.done.text) msg = `<p class="msg">${esc(a.done.text)}</p>`;
  } else if (a.st === "stopped") {
    st = '<span class="sq"></span>stopped by you';
  } else if (a.st === "failed") {
    st = `<span class="dot" style="--c: var(--err)"></span>failed · ${agoShort(a.at)}`;
    msg = err;
  } else {
    st = `idle · ${agoShort(a.at)}`;
  }
  return `<div class="${cls}"${data}><div class="ah">${av(a.name)}<span class="nm">${esc(a.name)}</span><span class="st">${st}</span>${act}</div>${msg}</div>`;
}

// Layers of this file are buttons that select and zoom; another file's are only names.
function event(e, here) {
  const chips = (e.layers || []).map((l) => {
    const type = l.type === "COMPONENT_SET" ? "COMPONENT" : l.type;
    const gone = here && goneLayers.has(l.id);
    const cls = "layer" + (type === "COMPONENT" || type === "INSTANCE" ? " comp" : "") + (gone ? " gone" : "");
    const inner = `${ICON[type] || ICON.FRAME}<span>${esc(l.name)}</span>`;
    return here ? `<button type="button" class="${cls}" data-act="layer" data-id="${esc(l.id)}" title="${gone ? "Not in the file any more" : "Select it in Figma"}">${inner}</button>`
      : `<span class="${cls}">${inner}</span>`;
  }).join("") + (e.more ? `<span class="more">+${e.more}</span>` : "");
  const note = e.note ? ` <em>· ${esc(e.note)}</em>` : "";
  return `<div class="ev${e.kind === "err" ? " err" : e.kind === "stop" ? " stop" : ""}"><span class="t" data-ago="${e.at}">${ago(e.at)}</span>`
    + `<span class="s"><em>${esc(e.agent)}</em> <b>${esc(e.summary)}</b>${note}</span>`
    + (chips ? `<div class="layers">${chips}</div>` : "") + "</div>";
}

function panel(f) {
  const on = conn === "ok";
  const list = on ? agentsOf(f) : [];
  const feed = on ? f.recent.slice(0, 5) : [];
  return '<div class="panel">' + callout(f)
    + (list.length ? '<div class="sect">Agents</div>' + list.map((a) => agentRow(f, a)).join("") : "")
    + (feed.length ? '<div class="sect">Recent</div><div class="feed">' + feed.map((e) => event(e, f.here)).join("") + "</div>" : "")
    + "</div>";
}

// An island that opens or closes keeps its panel in a fold that grows from
// nothing or shrinks back to it (the CSS above).
function island(f, cls, anim) {
  const isOpen = open.has(f.id);
  const shut = !isOpen && closing.has(f.id);
  const state = isOpen ? " open" + (anim ? " opening" : "") : shut ? " closing" : "";
  return `<div class="slot${cls}" data-fid="${esc(f.id)}"><div class="island${state}">${row(f)}`
    + (isOpen || shut ? `<div class="fold"><div>${panel(f)}</div></div>` : "") + "</div></div>";
}

// The window's last line: the Figaro version, and what there is to do about a
// newer one — update to a release, or reload newer plugin code from disk. Why
// an update or a reload failed goes on a line above it.
function footer() {
  const on = conn === "ok";
  const latest = on && ((board && board.update && board.update.latest) || (update && update.latest));
  const release = on && !latest && board && board.release;  // newer, and the bridge has no Update button
  const doing = on && board && board.updating;
  const failed = on && !doing && board && board.failed;
  let why = "", right = "";
  if (doing) {
    const reload = doing.what === "reload";
    const text = doing.step === "wait" ? (reload ? "Reloads once the scripts finish" : "Updates once the scripts finish")
      : doing.step === "pull" ? `Updating to ${esc(doing.to || latest || "the new version")}…`
      : reload ? "Reloading Figaro…" : "Restarting Figaro…";
    right = `<span class="spin"></span><span class="txt">${text}</span>`;
  } else if (failed) {
    const what = failed.what === "reload" ? "reload" : "update" + (latest ? " to " + esc(latest) : "");
    why = `<div class="why"><span class="warn">${ICON.warn}</span><span title="${esc(failed.detail || failed.error)}">Couldn't ${what}: ${esc(failed.error)}</span></div>`;
    if (failed.url) right = `<button type="button" class="go" data-act="release" data-url="${esc(failed.url)}">Open release</button>`;
  } else if (latest) {
    right = `<button type="button" class="go" data-act="update" title="Download it, restart the bridge and reload the plugin, once the scripts finish">${ICON.up}Update to ${esc(latest)}</button>`;
  } else if (on && stale()) {
    right = '<span class="txt">New build</span><button type="button" class="go build" data-act="reload" title="Reload the plugin with the code on disk, once the scripts finish">Reload</button>';
  } else if (release && release.latest) {
    right = `<button type="button" class="out" data-act="release" data-url="${esc(release.url || "")}" title="The Update button is off on this computer. To update: git pull in the Figaro folder, restart the bridge, then press Reload here"><span>${esc(release.latest)} is out</span>${ICON.out}</button>`;
  }
  return `<div class="foot">${why}<div class="line"><span class="ver">Figaro${version ? " " + esc(version) : ""}</span>`
    + (right ? `<span class="what">${right}</span>` : "") + "</div></div>";
}

// ─── rendering ───────────────────────────────────────────────────────────
// The window is drawn anew from its state. An island that appears grows in,
// one that goes away shrinks out; a redraw waits for those to finish, and for
// a pressed button to be released, so it never swallows a click.
const app = document.getElementById("app");
const onScreen = new Set();    // islands on screen, by id
let lastFiles = new Map();
let animId = null;             // the island whose panel just opened
let ready = false;
let animUntil = 0;
let later = null;
let pressed = false;
let dirty = false;
let lastHtml = "";
let lastSig = "";              // what the islands showed, apart from clocks: signature()
const ANIM_MS = 400;           // the longest animation: an island coming, going, opening, closing

function schedule() {
  if (pressed) { dirty = true; return; }
  const wait = animUntil - Date.now();
  if (wait > 0) {
    clearTimeout(later);
    later = setTimeout(schedule, wait);
    return;
  }
  render();
}

function render() {
  dirty = false;
  const now = Date.now();
  for (const [key, at] of stopping) if (now - at > 3000) stopping.delete(key);  // the board says by then
  for (const [id, at] of closing) if (now - at >= ANIM_MS) closing.delete(id);
  lastSig = signature();
  const files = filesNow();
  const byId = new Map(files.map((f) => [f.id, f]));
  const opening = animId;
  let html = "";
  let moving = animId !== null || closing.size > 0;
  for (const f of files) {
    if (shown(f)) {
      const enter = ready && !onScreen.has(f.id);
      onScreen.add(f.id);
      html += island(f, enter ? " enter" : "", animId === f.id);
      moving = moving || enter;
    } else if (onScreen.has(f.id)) {
      onScreen.delete(f.id);
      html += island(f, " leave", false);
      moving = true;
    }
  }
  for (const id of [...onScreen]) {
    if (byId.has(id)) continue;
    onScreen.delete(id);  // its plugin closed: its island shrinks out
    const f = lastFiles.get(id);
    if (f) { html += island(f, " leave", false); moving = true; }
  }
  html += footer();
  lastFiles = byId;
  animId = null;
  ready = true;
  if (html !== lastHtml) {
    app.innerHTML = html;
    lastHtml = html;
  }
  if (opening !== null) growAhead(opening);
  if (moving) {
    animUntil = Date.now() + ANIM_MS;
    clearTimeout(later);
    later = setTimeout(schedule, ANIM_MS);  // then without the animations' classes
  }
  fit();
}

// The window follows its islands: Figma sizes it from the sandbox (code.js).
// Figma resizes it a frame or two after it asks, so while an island opens the
// window grows ahead of it by two frames of its growth (at most LEAD px), never
// past where it ends and never back: the island and the line under it are
// never cut off on the way.
const LEAD = 64;
let sentHeight = 0;
let lastHeight = 0;
let growTo = 0;
let growUntil = 0;
function growAhead(id) {
  const slot = [...app.querySelectorAll(".slot")].find((el) => el.dataset.fid === id);
  const inner = slot && slot.querySelector(".fold > div");
  if (!inner || !app.getBoundingClientRect) return;
  lastHeight = Math.ceil(app.getBoundingClientRect().height);
  growTo = lastHeight + Math.ceil(inner.scrollHeight);
  growUntil = Date.now() + ANIM_MS - 20;
}
function fit() {
  const content = Math.ceil(app.getBoundingClientRect ? app.getBoundingClientRect().height : 0);
  let height = content;
  if (content > 0 && Date.now() < growUntil) {
    const lead = Math.min(LEAD, Math.max(0, 2 * (content - lastHeight)));
    height = Math.max(content, Math.min(growTo, Math.max(sentHeight, content + lead)));
  }
  lastHeight = content;
  if (height > 0 && height !== sentHeight) {
    sentHeight = height;
    parent.postMessage({ pluginMessage: { type: "resize", height } }, "*");
  }
}
if (typeof ResizeObserver === "function") new ResizeObserver(fit).observe(app);

// ─── the buttons ─────────────────────────────────────────────────────────
function act(name, fid, el) {
  const f = fid ? filesNow().find((x) => x.id === fid) : null;
  if (name === "toggle" && f) {
    if (open.has(f.id)) {
      open.delete(f.id);
      if (!calm()) closing.set(f.id, Date.now());
    } else {
      open.add(f.id);
      closing.delete(f.id);
      animId = f.id;
    }
    render();
  } else if (name === "stop" && f && f.doc && el.dataset.agent) {
    stopping.set(f.doc + "\n" + el.dataset.agent, Date.now());
    send({ type: "stop", doc: f.doc, agent: el.dataset.agent });
    render();
  } else if (name === "update") {
    send({ type: "update-now" });
  } else if (name === "reload") {
    send({ type: "reload-all" });
  } else if (name === "release") {
    parent.postMessage({ pluginMessage: { type: "open-url", url: el.dataset.url } }, "*");
  } else if (name === "layer") {
    parent.postMessage({ pluginMessage: { type: "select", id: el.dataset.id } }, "*");
  }
}

// The pointer on an agent's row: the window is drawn anew from its state, so
// the new rows take `hot` from here, and a redraw neither drops the highlight
// nor plays its fade again.
function point(key) {
  if (key === hot) return;
  hot = key;
  for (const el of app.querySelectorAll(".agent[data-agent]")) {
    const slot = el.closest("[data-fid]");
    el.classList.toggle("hot", !!slot && slot.dataset.fid + "\n" + el.dataset.agent === key);
  }
}
document.addEventListener("pointerover", (e) => {
  const row = e.target && e.target.closest ? e.target.closest(".agent[data-agent]") : null;
  const slot = row && row.closest("[data-fid]");
  point(slot ? slot.dataset.fid + "\n" + row.dataset.agent : "");
});
document.addEventListener("pointerout", (e) => { if (!e.relatedTarget) point(""); });  // it left the window
const calm = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

document.addEventListener("click", (e) => {
  const el = e.target && e.target.closest ? e.target.closest("[data-act]") : null;
  if (!el || el.disabled) return;
  const slot = el.closest("[data-fid]");
  act(el.dataset.act, slot ? slot.dataset.fid : null, el);
});
let pressTimer = null;
function release() {
  clearTimeout(pressTimer);
  if (!pressed) return;
  pressed = false;
  setTimeout(() => { if (dirty) schedule(); }, 0);  // after the click that follows
}
document.addEventListener("pointerdown", () => {
  pressed = true;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(release, 2000);  // a press that never ends must not freeze the window
});
document.addEventListener("pointerup", release);
document.addEventListener("pointercancel", release);

// Live clocks and "2m ago", and what changes with time alone: an agent quiet
// for activeFor is no longer at work, and one quiet for SHOW_FOR leaves its
// island.
function signature() {
  return filesNow().map((f) => [f.id, shown(f), headline(f).kind,
    agentsOf(f).map((a) => a.name + ":" + a.st).join()].join("|")).join("\n");
}
setInterval(() => {
  for (const el of app.querySelectorAll("[data-clock]")) el.textContent = clock(+el.dataset.clock);
  for (const el of app.querySelectorAll("[data-ago]")) el.textContent = el.dataset.long ? agoLong(+el.dataset.ago) : ago(+el.dataset.ago);
  if (signature() !== lastSig) schedule();
}, 1000);

// ─── the bridge ──────────────────────────────────────────────────────────
function connect() {
  clearTimeout(reconnectTimer);
  try {
    ws = new WebSocket(SERVER);
  } catch (e) {
    log("[ws] new WebSocket failed: " + e.message);
    reconnectTimer = setTimeout(connect, 2000);
    return;
  }

  ws.onopen = () => {
    // A new bridge may have different code on disk; it says `outdated` and
    // `update` again at hello time, and sends its board.
    conn = "ok";
    failures = 0;
    outdated = false;
    update = null;
    board = null;
    shift = null;
    log("[ws] connected" + (identity.name ? ` as ${identity.name}` : ""));
    sendHello();
    // In case identity hasn't arrived from the plugin yet, ask for it.
    parent.postMessage({ pluginMessage: { type: "need-identity" } }, "*");
    schedule();
  };

  ws.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch (err) {
      log("[ws] bad message: " + err.message);
      return;
    }
    if (msg.type === "exec") {
      log(`[exec] ${shortId(msg.id)} code=${(msg.code || "").length}b`);
      local.set(msg.id, { agent: msg.agent || "agent", since: Date.now() });
      if (!board) schedule();
      // timeout rides along: h.ck() in code.js stops a run once it has passed.
      // So do agent, readOnly, checkpoint, quick and libs — every field
      // bridge_exec.exec_fields sends (tests/test_exec.py checks the list).
      toSandbox({
        type: "exec", id: msg.id, code: msg.code, timeout: msg.timeout,
        agent: msg.agent, readOnly: msg.readOnly, checkpoint: msg.checkpoint,
        quick: msg.quick, libs: msg.libs });
    } else if (msg.type === "undo") {
      // Revert the last script — code.js decides whether that is safe.
      toSandbox({ type: "undo", id: msg.id, agent: msg.agent, force: msg.force });
    } else if (msg.type === "reload") {
      // New code.js and ui.html from disk; this window is replaced by it.
      toSandbox({ type: "reload", id: msg.id, code: msg.code, html: msg.html });
    } else if (msg.type === "ping") {
      // Liveness probe: the bridge sends this when another plugin instance
      // wants the slot. Answering keeps ours.
      try { ws.send(JSON.stringify({ type: "pong" })); } catch (e) {}
    } else if (msg.type === "abort") {
      // The bridge gave up on this run, or the user pressed Stop; code.js
      // marks it so h.ck() throws.
      parent.postMessage({ pluginMessage: { type: "abort", id: msg.id } }, "*");
    } else if (msg.type === "board") {
      takeBoard(msg);
      schedule();
    } else if (msg.type === "update") {
      // A newer release (vX.Y.Z tag) than the bridge's VERSION; url = its release page.
      update = { latest: msg.latest, current: msg.current, url: msg.url };
      schedule();
    } else if (msg.type === "outdated") {
      outdated = true;
      log(`[outdated] running ${msg.running}, bridge has ${msg.expected}`);
      schedule();
    }
  };

  ws.onclose = () => {
    // The bridge holds one slot per open file, so a close is always transient:
    // bridge restart, or this tab's socket dropped. Just reconnect.
    failures++;
    conn = failures >= NO_BRIDGE_AFTER ? "nobridge" : "connecting";
    board = null;
    local.clear();
    stopping.clear();
    log("[ws] disconnected");
    hush();  // no bridge, no agents — let the Mac sleep
    reconnectTimer = setTimeout(connect, 2000);
    schedule();
  };
}

window.onmessage = (e) => {
  const m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === "identity") {
    identity = { fileKey: m.fileKey || null, name: m.name || null, docSig: m.docSig || null,
                 pluginVersion: m.pluginVersion || null, caps: m.caps || [] };
    log(`[id] file=${identity.name}`);
    sendHello();  // (re-)register this connection under the file name
    schedule();
    return;
  }
  if (m.type === "selected") {
    if (m.ok) goneLayers.delete(m.id); else goneLayers.add(m.id);
    schedule();
    return;
  }
  if ((m.type === "result" || m.type === "error") && local.delete(m.id) && !board) schedule();
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log(`[drop] ws not open, ${m.type} id=${shortId(m.id)}`);
    return;
  }
  try {
    if (typeof m.valueJson === "string") {
      // Already-serialized result: splice it in rather than parse + re-stringify.
      const { valueJson, ...rest } = m;
      ws.send(JSON.stringify(rest).slice(0, -1) + ',"value":' + valueJson + "}");
    } else {
      ws.send(JSON.stringify(m));
    }
  } catch (err) {
    log("[send] failed: " + err.message);
    return;
  }
  if (m.type === "result") log(`[ok]  ${shortId(m.id)}`);
  else if (m.type === "error") log(`[err] ${shortId(m.id)} ${m.text}`);
};

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (!ws || ws.readyState === WebSocket.CLOSED || ws.readyState === WebSocket.CLOSING) {
    log("[ws] tab visible again — reconnecting now");
    connect();
  }
});

parent.postMessage({ pluginMessage: { type: "need-identity" } }, "*");
render();
connect();
</script>
</body>
</html>
