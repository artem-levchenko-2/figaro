<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* The plugin's window: one island per file where Figaro runs — this file
   first, then the others in the order they connected — and under them a line
   with the Figaro version and the window's tools: Settings, which shows the
   settings and the version's details in place of the islands, and Minimize,
   which leaves one card (hold it, and only the state). Figma draws the header above (the plugin's icon
   and name, the close button): 40 px, the last of them a line; the islands
   keep 6 px from that line, or it reads as their border. They line up with the
   header: indicators and avatars on the icon's centre (x 24), names on the
   title's left edge (x 41), chevrons on the close button's centre (20 px from
   the right). Inside an island what starts 9 px from its left edge ends 9 px
   from its right one (x 15 to 305). The window's corners are 13 px and the
   islands sit 6 px in, so theirs are 13 − 6 = 7 px, and they are 6 px apart.
   The window is as tall as its islands and stays on Figma's canvas
   (code.js): with no room under it, it moves up. Only a window taller than
   the canvas scrolls them, as one list; the line with the version stays at
   the window's bottom.
   The scrollbar runs in the 6 px right of the islands, thin, and shows only
   while the pointer is on the list or it scrolls. An open island's row stays
   at the top while its panel scrolls under it. */
* { box-sizing: border-box; }
:root {
  /* Figma's own window (themeColors), for what sits outside the islands */
  --win-bg: var(--figma-color-bg, #2c2c2c);
  --win-dim: var(--figma-color-text-secondary, rgba(255, 255, 255, .7));
  --win-faint: var(--figma-color-text-tertiary, rgba(255, 255, 255, .4));
  --win-bar: rgba(255, 255, 255, .2);       /* the scrollbar, and under the pointer */
  --win-bar-hot: rgba(255, 255, 255, .36);
  /* the islands: black in Figma's dark theme, white in its light one (below) */
  --is-bg: #0b0b0c;
  --is-edge: transparent;
  --is-text: #f4f4f6;
  --is-dim: rgba(244, 244, 246, .6);
  --is-faint: rgba(244, 244, 246, .38);
  --is-line: rgba(255, 255, 255, .08);
  --is-fill: rgba(255, 255, 255, .1);
  --is-fill-2: rgba(255, 255, 255, .18);
  --is-hover: rgba(255, 255, 255, .08);
  --is-tint: 32%;                /* how much of its colour a hovered button takes */
  --is-err: #ff8b74;
  --is-comp: #b58cff;
  --is-ink: #fff;                /* what a callout's code mixes its colour with */
  --is-warn: #ffb224;            /* the yellow "!" of a failed update, in both themes */
  --is-warn-on: #2a1c00;         /* its "!": white in the light theme */
  --ok: #14ae5c;
  --run: #0d99ff;
  --run-hover: #0b88e3;
  --wait: #ffb224;
  --err: #f24822;
  --build: #a866ff;              /* a little lighter than Figma's purple on the dark islands */
  --idle: #8e8e93;
  --glow: 70%;                   /* how much of its colour a coloured indicator's glow takes */
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --sys-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* Figma's light theme (themeColors marks the page figma-light): white islands
   with a hairline edge on a grey-blue ground, the same layout. */
html.figma-light {
  --win-bg: #eef1f5;
  --win-dim: rgba(26, 32, 44, .68);
  --win-faint: rgba(26, 32, 44, .5);
  --win-bar: rgba(26, 32, 44, .2);
  --win-bar-hot: rgba(26, 32, 44, .36);
  --is-bg: #ffffff;
  --is-edge: rgba(26, 32, 44, .12);
  --is-text: #1b1d22;
  --is-dim: rgba(26, 32, 44, .62);
  --is-faint: rgba(26, 32, 44, .48);
  --is-line: rgba(26, 32, 44, .09);
  --is-fill: rgba(26, 32, 44, .06);
  --is-fill-2: rgba(26, 32, 44, .1);
  --is-hover: rgba(26, 32, 44, .05);
  --is-tint: 16%;
  --is-err: #d23a1d;
  --is-comp: #8a55f5;
  --is-ink: #000;
  --is-warn-on: #fff;
  --build: #9747ff;
  --glow: 10%;
}
html, body { height: 100%; margin: 0; background: var(--win-bg); overflow: hidden; }
body { display: flex; flex-direction: column; font-family: var(--sys); -webkit-font-smoothing: antialiased; }
button { font: inherit; }
#scroll { flex: 0 1 auto; min-height: 0; margin: 6px 0 0 6px; overflow-y: auto; overscroll-behavior: contain;
  overflow-anchor: none; scrollbar-gutter: stable; }
#scroll::-webkit-scrollbar { width: 6px; background: transparent; }
#scroll::-webkit-scrollbar-track { background: transparent; }
#scroll::-webkit-scrollbar-thumb { border: 1px solid transparent; border-radius: 3px; background: transparent padding-box; }
#scroll:hover::-webkit-scrollbar-thumb, #scroll.moving::-webkit-scrollbar-thumb { background-color: var(--win-bar); }
#scroll::-webkit-scrollbar-thumb:hover, #scroll::-webkit-scrollbar-thumb:active { background-color: var(--win-bar-hot); }
#end { height: 6px; }  /* under the last island: the window's bottom edge, or its last line */
#foot { flex: none; padding: 0 6px 6px; }
#foot:empty { display: none; }
/* An island cut by the list's top edge gets round corners there, and its
   hairline in the light theme, as if it began there; one cut by the bottom
   edge fades out, so it shows that more of it is below, and so does the line
   with the version (edges()). */
#app::before { content: ""; position: sticky; top: 0; z-index: 3; display: none; height: 7px; margin-bottom: -7px; pointer-events: none;
  background: radial-gradient(circle 7px at 7px 7px, transparent 5.75px, var(--is-edge) 6.25px, var(--is-edge) 6.75px, var(--win-bg) 7.25px) left top / 7px 7px no-repeat,
    radial-gradient(circle 7px at 0 7px, transparent 5.75px, var(--is-edge) 6.25px, var(--is-edge) 6.75px, var(--win-bg) 7.25px) right top / 7px 7px no-repeat,
    linear-gradient(var(--is-edge), var(--is-edge)) center top / calc(100% - 14px) 1px no-repeat; }
#scroll.up #app::before { display: block; }
#scroll.down {
  -webkit-mask: linear-gradient(#000 calc(100% - 18px), transparent) left / calc(100% - 6px) 100% no-repeat, linear-gradient(#000, #000) right / 6px 100% no-repeat;
  mask: linear-gradient(#000 calc(100% - 18px), transparent) left / calc(100% - 6px) 100% no-repeat, linear-gradient(#000, #000) right / 6px 100% no-repeat; }

/* A slot grows and shrinks around its island as it comes and goes. */
.slot { display: grid; grid-template-rows: 1fr; }
.slot + .slot { margin-top: 6px; }
.slot.enter { animation: rise .34s cubic-bezier(.2, .8, .2, 1) backwards; }
.slot.enter > .island { animation: pop .34s cubic-bezier(.2, .8, .2, 1) backwards; }
.slot.leave { animation: sink .26s cubic-bezier(.4, 0, .8, .4) forwards; pointer-events: none; }
@keyframes rise { from { grid-template-rows: 0fr; margin-top: 0; opacity: 0; } }
@keyframes pop { from { transform: scale(.96); } }
@keyframes sink { to { grid-template-rows: 0fr; margin-top: 0; opacity: 0; } }
/* overflow: clip, not hidden, which would keep the row from sticking; and
   min-width: 0, as clip leaves a grid item as wide as its row's text, so a
   long name would push its end out of the window. The hairline edge goes over
   the row, which covers what scrolls under it. */
.island { --pad: 9px; --bpad: 4px; position: relative; min-width: 0; min-height: 0; overflow: clip; border-radius: 7px; background: var(--is-bg); color: var(--is-text); font-size: 12px; line-height: 16px; }
.island::after { content: ""; position: absolute; inset: 0; z-index: 2; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--is-edge); pointer-events: none; }
.row { position: sticky; top: 0; z-index: 1; height: 30px; display: flex; align-items: center; gap: 4px; padding-right: var(--bpad); background: var(--is-bg); }
.tg { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 8px; padding: 0 0 0 var(--pad); border: 0; background: none; color: inherit; text-align: left; cursor: pointer; }
.tg:focus-visible, .chev:focus-visible { outline: 2px solid var(--run); outline-offset: -2px; border-radius: 7px; }
.ind { width: 18px; height: 18px; flex: none; display: grid; place-items: center; }
/* The indicators come in three kinds. A dot, 7 px, is calm: a file ready, or no
   bridge yet (grey). A disc with a mark, 11 px, is an event or a request: done ✓,
   failed ×, stopped ■ (cut out of a grey disc), Figma isn't answering !, an update
   ⤓, a new build ↻, an agent asking ?. Motion means something is under way: the
   pixel grid for an agent, a spinner for Figaro itself (connecting, updating,
   restarting). Every one in colour glows in it, a 1.5 px core and a 6 px bloom,
   strong in the dark theme and faint in the light one (--glow), and so does a
   stopped agent's grey disc; the other grey ones and the buttons don't. */
.spin { --c: var(--run); width: 10px; height: 10px; border: 1.5px solid color-mix(in srgb, var(--c) 24%, transparent); border-top-color: var(--c); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.dot { --c: var(--ok); width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.dot.idle, .spin.idle { --c: var(--idle); }
.bdg { --c: var(--ok); flex: none; display: grid; color: var(--c); }
.bdg svg { width: 11px; height: 11px; }
.bdg.failed, .bdg.alarm { --c: var(--err); }
.bdg.stopped { --c: var(--is-dim); }
.bdg.caution { --c: var(--is-warn); }
.bdg.update, .bdg.ask { --c: var(--run); }
.bdg.build { --c: var(--build); }
.dot, .bdg, .spin, .px i { --gc: color-mix(in srgb, var(--c) var(--glow), transparent); filter: drop-shadow(0 0 1.5px var(--gc)) drop-shadow(0 0 6px var(--gc)); }
.dot.idle, .spin.idle, .go .spin { filter: none; }
/* A line icon keeps a 1.3 px line at any size. */
svg [stroke="currentColor"] { vector-effect: non-scaling-stroke; stroke-width: 1.3px; }
/* An agent at work: a 3x3 pixel grid with a diagonal wave, from the top left cell to
   the bottom right one, and a shimmer sweeping over the word. A cell's delay is
   its row plus its column, a quarter of the wave's spread (half the cycle) per
   step. The grid's cycle, 0.9 s, is half the shimmer's 1.8 s, so every grid and
   shimmer keeps one beat (inStep). */
.px { --c: var(--run); flex: none; display: grid; grid-template-columns: repeat(3, 2.5px); gap: 1px; }
.px i { width: 2.5px; height: 2.5px; border-radius: .5px; background: var(--c); opacity: .18; animation: px 900ms ease-in-out infinite; }
.px i:nth-child(1) { animation-delay: 0ms; }
.px i:nth-child(2), .px i:nth-child(4) { animation-delay: 112.5ms; }
.px i:nth-child(3), .px i:nth-child(5), .px i:nth-child(7) { animation-delay: 225ms; }
.px i:nth-child(6), .px i:nth-child(8) { animation-delay: 337.5ms; }
.px i:nth-child(9) { animation-delay: 450ms; }
/* A click on a grid, in an agent's row or an island's own, turns every grid in the window into a
   rainbow whose wave runs back, from the bottom right cell to the top left one, and another click
   back (`rainbow` on <html>): only the colours and the delays change, the animation is the same.
   Minimized, the grid is the card's restore. */
.agent .px, .island .tg .px { padding: 3px; margin: -3px; }
html.rainbow .px i:nth-child(1) { --c: hsl(0 85% 58%); animation-delay: 450ms; }
html.rainbow .px i:nth-child(2), html.rainbow .px i:nth-child(4) { --c: hsl(35 95% 55%); animation-delay: 337.5ms; }
html.rainbow .px i:nth-child(3), html.rainbow .px i:nth-child(5), html.rainbow .px i:nth-child(7) { --c: hsl(130 60% 48%); }
html.rainbow .px i:nth-child(6), html.rainbow .px i:nth-child(8) { --c: hsl(210 90% 58%); animation-delay: 112.5ms; }
html.rainbow .px i:nth-child(9) { --c: hsl(275 75% 62%); animation-delay: 0ms; }
@keyframes px { 0%, 100% { opacity: .18; } 20% { opacity: 1; } 50% { opacity: .18; } }
.shim { background: linear-gradient(90deg, var(--is-dim) 35%, var(--is-text) 50%, var(--is-dim) 65%) 0 0 / 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 1.8s linear infinite; }
@keyframes shim { from { background-position: 150% center; } to { background-position: -50% center; } }
.lbl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.lbl b { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.lbl .sub { flex: 0 4 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--is-dim); font-variant-numeric: tabular-nums; }
.right { flex: none; display: flex; align-items: center; gap: 4px; }
.ib { width: 18px; height: 18px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 9px; background: var(--is-fill); color: var(--is-text); cursor: pointer; }
.ib:hover { background: color-mix(in srgb, var(--err) var(--is-tint), transparent); color: var(--is-err); }
.ib:disabled { cursor: default; background: var(--is-fill); color: var(--is-faint); }
.sq { width: 7px; height: 7px; border-radius: 1.5px; background: currentColor; }
.lbl .sub.alarm { color: var(--is-err); }
.chev { width: 20px; height: 20px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--is-faint); cursor: pointer; }
.chev svg { width: 10px; height: 10px; }
.island.open .chev { transform: rotate(180deg); }

/* An island opens by growing its panel from nothing, pushing the islands under
   it down, and closes the same way back; the window follows it (fit). */
.fold { display: grid; grid-template-rows: 1fr; }
.fold > div { min-height: 0; overflow: hidden; }
/* The line between an open island's row and its panel goes with the row,
   which stays at the top while the panel scrolls under it. */
.panel { padding-bottom: 5px; border-top: 1px solid transparent; }
.island.open .row, .island.closing .row { box-shadow: 0 1px 0 var(--is-line); }
.island.opening .fold { animation: unfold .36s cubic-bezier(.45, 0, .2, 1) both; }
.island.opening .panel { animation: drop .36s cubic-bezier(.2, .8, .2, 1) both; }
.island.opening .chev { animation: chev-open .36s cubic-bezier(.45, 0, .2, 1); }
.island.closing .fold { animation: refold .3s cubic-bezier(.4, 0, .2, 1) forwards; }
.island.closing .panel { animation: lift .22s ease forwards; }
.island.closing .chev { animation: chev-close .3s cubic-bezier(.4, 0, .2, 1); }
.island.closing .sub { animation: appear .3s ease; }
/* While the window drives an island open or shut (drive()), its fold takes
   the height Figma has given the window, not the clock's. */
.island.driven .fold { animation: none; }
@keyframes unfold { from { grid-template-rows: 0fr; } }
@keyframes refold { to { grid-template-rows: 0fr; } }
@keyframes drop { from { opacity: 0; transform: translateY(-8px); } }
@keyframes lift { to { opacity: 0; transform: translateY(-4px); } }
@keyframes chev-open { from { transform: rotate(0deg); } }
@keyframes chev-close { from { transform: rotate(180deg); } }
@keyframes appear { from { opacity: 0; } }
.sect { padding: 11px var(--pad) 3px; color: var(--is-faint); font-size: 10px; line-height: 12px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.callout { --c: var(--idle); display: grid; gap: 4px; margin: 6px calc(var(--pad) - 6px) 0; padding: 6px 6px 8px; border-radius: 5px; background: color-mix(in srgb, var(--c) 13%, var(--is-bg)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) var(--is-tint), transparent); }
.callout .h { min-height: 18px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.callout p { margin: 0 0 0 26px; color: var(--is-dim); font-size: 11.5px; line-height: 16px; }
.callout code { color: color-mix(in srgb, var(--c) 45%, var(--is-ink)); font: 11px/15px var(--sys-mono); overflow-wrap: anywhere; }
.callout.alarm { --c: var(--err); }
/* An agent: its name, a little heavier than the text around it, and what it
   is doing, and under them the note it left (done), grey like the status, or
   the error its last script stopped at, in red. An agent at work shows its
   Stop while the pointer is on it, in a highlight 4 px in from the island's
   edges, with the avatar and the Stop 5 px in from its ends. The Stop makes
   room first and then appears; going, it fades first. */
.agent { margin: 0 calc(var(--pad) - 5px); padding: 0 5px; border-radius: 14px; }
.agent[data-agent] { transition: background-color .18s ease; }
.agent.hot, .agent.held { background: var(--is-hover); }
.ah { height: 28px; display: flex; align-items: center; gap: 8px; }
.av { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--av, #7b61ff); color: #fff; font-size: 10px; font-weight: 700; }
.nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.st { flex: none; display: flex; align-items: center; gap: 6px; color: var(--is-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.act { flex: none; width: 0; height: 18px; margin-left: -8px; display: flex; justify-content: flex-end;
  transition: width .2s cubic-bezier(.4, 0, .2, 1) .05s, margin-left .2s cubic-bezier(.4, 0, .2, 1) .05s; }
.act .ib { flex: none; opacity: 0; transform: scale(.6); pointer-events: none; transition: opacity .1s ease, transform .14s ease; }
.hot .act, .held .act, .agent:focus-within .act { width: 18px; margin-left: -2px; transition-delay: 0s; transition-timing-function: cubic-bezier(.2, .8, .2, 1); }
.hot .act .ib, .held .act .ib, .agent:focus-within .act .ib { opacity: 1; transform: none; pointer-events: auto;
  transition: opacity .16s ease .06s, transform .22s cubic-bezier(.2, .8, .2, 1) .04s; }
/* An open island with no agent at work: a ghost of an agent's row under
   Agents, where the first one will show, and how to get one there. */
.av.ghost { background: none; border: 1px dashed var(--is-faint); }
/* The reviewer: an agent among the agents, with its own switch for the file, and its notes for the
   designer, a callout that asks which of them the agent should fix. The "?" explains it in a hint
   drawn outside the islands (#rvtip), as an island clips what sticks out of it. */
.av.rvi svg { width: 10px; height: 10px; }
.av.ghost.rvi { color: var(--is-dim); }
.nm.rvn { flex: 1; display: flex; align-items: center; gap: 5px; overflow: visible; }
.qm { display: grid; width: 12px; height: 12px; color: var(--is-faint); }
.qm:hover { color: var(--is-dim); }
.qm svg { width: 12px; height: 12px; }
.agent.rv .act { width: 18px; margin-left: -2px; }
.agent.rv .act.swa { width: 0; margin-left: -8px; align-items: center; }  /* the switch in the middle of the row, 6 px from its round end */
.agent.rv .act.swa .sw { margin-right: 1px; opacity: 0; pointer-events: none; transition: opacity .1s ease, background-color .15s; }
.agent.rv.hot .act.swa, .agent.rv:focus-within .act.swa { width: 27px; margin-left: -2px; }
.agent.rv.hot .act.swa .sw, .agent.rv:focus-within .act.swa .sw { opacity: 1; pointer-events: auto; transition: opacity .16s ease .06s, background-color .15s; }
.callout.rq { --c: var(--wait); margin-bottom: 6px; }
.callout.rq .h { padding-right: 2px; }
.callout.rq p { margin-left: 0; }
.callout.rq .acts { flex-wrap: wrap; margin: 10px 0 0; justify-content: flex-end; }
.rql { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.rql li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 11.5px; line-height: 15px; color: var(--is-dim); }
.rql li b { color: var(--is-text); font-weight: 500; }
.rql li em { font-style: normal; }
.rql li:not(.on) b, .rql li:not(.on) em { opacity: .55; }
.rql .layers { margin-top: 4px; }
.rql .cb { width: 14px; height: 14px; padding: 0; border: 0; background: none; display: grid; place-items: center; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--is-faint); color: #fff; cursor: pointer; }
.rql li.on .cb { background: var(--run); box-shadow: none; }
.rql .cb svg { width: 10px; height: 10px; }
.rq .showall { margin-left: auto; padding: 0 4px; border: 0; background: none; color: var(--is-dim); font: 500 11px/18px var(--sys); cursor: pointer; }
.rq .showall:hover { color: var(--is-text); }
#rvtip { position: fixed; z-index: 9; max-width: 232px; padding: 6px 9px; border-radius: 5px; background: #1e1e1e; color: #fff; font: 500 11px/15px var(--sys);
  box-shadow: 0 2px 10px rgba(0, 0, 0, .3); pointer-events: none; opacity: 0; transition: opacity .12s; }
#rvtip.on { opacity: 1; transition-delay: .3s; }
.msg { margin: -4px 0 0; padding: 0 0 7px 26px; color: var(--is-dim); font-size: 11.5px; line-height: 15px; overflow-wrap: anywhere; }
.msg.err { color: var(--is-err); }
.feed { display: grid; padding-bottom: 2px; }
.ev { display: grid; grid-template-columns: 26px minmax(0, 1fr); padding: 5px var(--pad); }
.ev .t { color: var(--is-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.ev .s { min-width: 0; overflow-wrap: anywhere; }
.ev .s em { color: var(--is-dim); font-style: normal; }
.ev.err .s b { color: var(--is-err); }
.ev.stop .s b { color: var(--is-dim); }
.layers { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.layer { height: 20px; max-width: 100%; display: inline-flex; align-items: center; gap: 4px; padding: 0 7px 0 5px; border: 0; border-radius: 5px; background: var(--is-fill); color: var(--is-text); font: 500 11px/1 var(--sys); }
button.layer { cursor: pointer; }
button.layer:hover { background: color-mix(in srgb, var(--run) var(--is-tint), transparent); }
.layer.gone { opacity: .45; }
.layer.gone span { text-decoration: line-through; }
.layer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer svg { width: 12px; height: 12px; flex: none; color: var(--is-dim); }
.layer.comp svg { color: var(--is-comp); }
.more { align-self: center; padding: 0 2px; color: var(--is-faint); font-size: 11px; }

/* The window's last line, under the islands: the Figaro version on the left,
   and on the right its tools, Settings and Minimize. A newer release shows by
   the version, with its button right after it: Update, or, where the bridge
   has no Update button, a link to the release; and Skip after that while the
   pointer is in the window, which puts the release away until the next one.
   While Figaro updates or reloads, a spinner and what it does take the
   version's place. When an update or a reload failed, a yellow "!" by the
   version opens the settings, which say why.
   Its text keeps the islands' inner edge, x 15; the minimize button's centre
   is at x 300, under Figma's close button. */
.foot { color: var(--win-faint); font-size: 11px; font-weight: 500; }
.foot .line { height: 22px; display: flex; align-items: center; gap: 8px; padding: 0 9px; white-space: nowrap; }
.foot .ver { flex: 0 1 auto; min-width: 0; display: flex; align-items: center; gap: 5px; }
.foot .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--win-dim); }
.foot .nb { color: var(--win-dim); }
.foot .spin { flex: none; }
.ver-b { display: inline-flex; align-items: center; gap: 5px; }
.ver-b svg { width: 10px; height: 10px; color: var(--is-dim); }
.foot .ver-b svg { color: var(--win-faint); }
.foot .ver-b .nv { color: var(--win-dim); }
.go { flex: none; height: 22px; display: inline-flex; align-items: center; gap: 5px; padding: 0 10px; border: 0; border-radius: 11px; background: var(--run); color: #fff; font: 600 11px/1 var(--sys); cursor: pointer; }
.go:hover { background: var(--run-hover); }
.go svg { width: 10px; height: 10px; margin-left: -1px; }
.go.build { background: var(--build); }
.go.build:hover { background: color-mix(in srgb, var(--build) 85%, #000); }
.go2 { flex: none; height: 22px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border: 0; border-radius: 11px; background: var(--is-fill-2); color: var(--is-text); font: 600 11px/1 var(--sys); cursor: pointer; }
.go2:hover { background: color-mix(in srgb, var(--is-text) 18%, transparent); }
.go2 svg { width: 10px; height: 10px; }
/* The window's small round buttons: the tools, a release's, Reload's, and
   restore in a minimized window. Settings is on while its view shows. */
.tools { flex: none; margin-left: auto; margin-right: -6px; display: flex; gap: 2px; }
.tl { position: relative; flex: none; width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 11px; background: none; color: var(--win-faint); cursor: pointer;
  transition: background-color .12s, color .12s; -webkit-user-select: none; user-select: none; touch-action: none; }
.tl:hover { background: var(--is-fill); color: var(--win-dim); }
.tl.on { color: var(--is-text); }  /* no fill: the next button stays 14 px from it */
.tl:focus-visible, .sw:focus-visible, .lnk:focus-visible, .go2:focus-visible, .row .chk-up:focus-visible { outline: 2px solid var(--run); outline-offset: -2px; }
.tl svg { width: 12px; height: 12px; }
.tl .bdg svg { width: 11px; height: 11px; }
/* What there is to do about the version: the new one's number with ⤓ in a
   blue pill, which updates; Reload's drawing in its colour, the yellow "!" a
   circle, and under the pointer a tint of that colour, as big as the tools'
   grey one. */
.foot .go.upv { gap: 4px; padding: 0 8px 0 9px; }
.foot .go.upv svg { width: 10px; height: 10px; margin: 0 -1px 0 0; color: inherit; }
.tl.build { color: var(--build); }
.tl.warn { color: var(--is-warn); }
.tl.build:hover { background: color-mix(in srgb, var(--build) 20%, transparent); color: var(--build); }
.tl.warn:hover { background: color-mix(in srgb, var(--wait) 20%, transparent); color: var(--is-warn); }
/* Hold Minimize to nanomize: a ring runs round the button, and the icon
   squeezes, as long as HOLD_MS. */
.tl .ic { transition: transform .12s ease; }
.tl .ring { position: absolute; inset: 0; width: 22px; height: 22px; transform: rotate(-90deg); pointer-events: none; }
.tl .ring circle { fill: none; stroke: var(--run); stroke-width: 1.7; stroke-linecap: round; stroke-dasharray: 60.3; stroke-dashoffset: 60.3; opacity: 0; transition: stroke-dashoffset .14s ease, opacity .14s ease; }
.tl.hold { background: color-mix(in srgb, var(--run) 18%, transparent); color: var(--run); }
.tl.hold .ring circle { stroke-dashoffset: 0; opacity: 1; transition: stroke-dashoffset 500ms linear, opacity .08s ease; }
.tl.hold .ic { transform: scale(.66); transition: transform 500ms cubic-bezier(.5, 0, .75, 0); }
/* Skip: a button without a fill until the pointer is on it; it shows only
   while the pointer is in the window (#foot.inside) or it has the focus. */
.foot .skip { height: 22px; padding: 0 6px; border: 0; border-radius: 11px; background: none; color: var(--win-faint); font: inherit; cursor: pointer;
  opacity: 0; pointer-events: none; transition: opacity .15s, background-color .12s, color .12s; }
#foot.inside .skip, .foot .skip:focus-visible { opacity: 1; pointer-events: auto; }
.foot .skip:hover, .foot .skip:focus-visible { background: var(--is-fill); color: var(--win-dim); }
/* What a button takes a press on, the circle its tint fills (Skip's pill),
   stays 2 px from the next one and from the words it belongs to, so none
   touches another. A new release the window can't install is a link, as in
   the settings: Skip 14 px from its arrow. */
.foot .ver > .tw:has(> .tl.build, > .tl.warn) { margin-left: -3px; }
.foot .ver > .tw:has(> .tl.build, > .tl.warn) + .tw:has(> .skip) { margin-left: -3px; }
.foot .ver > .ver-b:has(.upv) + .tw:has(> .skip) { margin-left: -3px; }
.foot .ver > .ver-b + .tw:has(> .skip) { margin-left: 3px; }
.foot .vlnk { color: var(--win-dim); font: inherit; line-height: 22px; }
.foot .vlnk:hover { color: var(--is-text); }
/* A button's hint comes after a moment, centred over it with a tail that
   points at it; by the window's edge it slides in to stay 6 px inside, the
   tail still on the button (placeTips). */
.tw { position: relative; flex: none; display: flex; }
.tip { --cx: 50%; position: absolute; left: 0; bottom: calc(100% + 7px); z-index: 4; padding: 5px 8px; border-radius: 5px; background: #1e1e1e; color: #fff;
  font: 500 11px/14px var(--sys); white-space: nowrap; box-shadow: 0 2px 10px rgba(0, 0, 0, .3); pointer-events: none;
  opacity: 0; transform: translateY(2px); transition: opacity .12s, transform .12s; }
.tip::after { content: ""; position: absolute; top: 100%; left: var(--cx); margin-left: -5px; border: 5px solid transparent; border-top-color: #1e1e1e; border-bottom: 0; }
.tip kbd { font: inherit; color: rgba(255, 255, 255, .62); }
.tw:hover .tip, .tw:has(:focus-visible) .tip { opacity: 1; transform: none; transition-delay: .45s; }
.tw:has(.hold) .tip, .tw:active .tip { opacity: 0; transform: translateY(2px); transition: none; }

/* The settings: a row with the way back, the switches in one island, and the
   version in an open one: what to do about it, what is new, and where
   Figaro runs. */
.head { height: 30px; display: flex; align-items: center; }
/* Back: words with no fill, brighter under the pointer, a press on any of the row's left part */
.back { height: 30px; display: inline-flex; align-items: center; gap: 4.5px; padding: 0 14px 0 10px; border: 0; border-radius: 7px; background: none;
  color: var(--win-dim); font: 600 12px/1 var(--sys); cursor: pointer; transition: color .12s; }
.back:hover { color: var(--is-text); }
.back:focus-visible { outline: 2px solid var(--run); outline-offset: -2px; }
.back svg { width: 10px; height: 10px; }
div.tg { cursor: default; }  /* the version's row: nothing to open */
.set { display: flex; align-items: center; gap: 12px; padding: 9px var(--pad); }
.set + .set { box-shadow: inset 0 1px 0 var(--is-line); }
.set .t { flex: 1; min-width: 0; display: grid; gap: 3px; }
.set .t b { font-weight: 500; line-height: 16px; }
.set .t span { color: var(--is-dim); font-size: 11px; line-height: 14px; }
.sets-off { margin: 0; padding: 0 var(--pad) 9px; color: var(--is-dim); font-size: 11px; line-height: 14px; }
.sw { position: relative; flex: none; width: 26px; height: 16px; padding: 0; border: 0; border-radius: 8px; background: var(--is-fill-2); cursor: pointer; transition: background-color .15s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s; }
.sw.on { background: var(--run); }
.sw.on::after { transform: translateX(10px); }
.sw:disabled { opacity: .45; cursor: default; }
/* The Figma token, open in the settings all the time; the ask for it on an island */
.set .t b .opt { margin-left: 6px; color: var(--is-faint); font-weight: 400; font-size: 11px; }
.fld { display: flex; gap: 6px; padding: 0 var(--pad); }
.inp { flex: 1; min-width: 0; height: 24px; display: flex; align-items: center; padding: 0 8px; border: 0; border-radius: 5px; outline: 0;
  background: var(--is-fill); box-shadow: inset 0 0 0 1px var(--is-line); color: var(--is-text); font: 11px/1 var(--sys-mono); white-space: nowrap; overflow: hidden; }
.inp:focus { box-shadow: inset 0 0 0 1.5px var(--run); }
.inp::placeholder { color: var(--is-faint); opacity: 1; }
.inp.err, .inp.err:focus { box-shadow: inset 0 0 0 1.5px var(--err); }
.inp.dim, .inp:disabled { color: var(--is-dim); }
.fld .go { height: 24px; border-radius: 12px; padding: 0 12px; }
.go:disabled { background: var(--is-fill-2); color: var(--is-faint); cursor: default; }
.go .spin { --c: var(--is-dim); }
.help { margin: 0; padding: 8px var(--pad) 0; color: var(--is-dim); font-size: 11px; line-height: 15px; }
.help b { color: var(--is-text); font-weight: 500; }
.help .lnk { display: inline-flex; vertical-align: top; color: var(--is-text); line-height: 15px; }
.help.err { color: var(--is-err); }
.help.last { padding-bottom: 10px; }
.set.tok { padding-bottom: 8px; }
.set .go2 { height: 20px; padding: 0 9px; }
.set .t .okc { color: var(--ok); }
.callout.ask { --c: var(--run); }
.callout .acts { display: flex; gap: 6px; margin: 4px 0 0 26px; }
.callout .acts .go, .callout .acts .go2 { height: 20px; padding: 0 9px; }
.row .go, .row .go2 { height: 20px; padding: 0 9px; margin-right: 1px; }
.row .chk-up { width: 20px; height: 20px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px; background: none; color: var(--is-faint); cursor: pointer; }
.row .chk-up:hover { background: var(--is-fill); color: var(--is-text); }
.row .chk-up svg { width: 10px; height: 10px; }
.off-note { margin: 0; padding: 10px var(--pad) 0; color: var(--is-dim); font-size: 11px; line-height: 16px; overflow-wrap: anywhere; }
.off-note code { font: 10.5px/1 var(--sys-mono); color: var(--is-text); }
/* An update or a reload that failed: what and why in plain words, a copy of
   the error for an agent, and the button to try again. */
.alert { margin: 10px 8px 0; padding: 8px 8px 11px 12px; border-radius: 9px; background: color-mix(in srgb, var(--wait) 12%, transparent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--wait) 28%, transparent); color: var(--is-dim); font-size: 11px; line-height: 16px; }
.alert .al-h { display: flex; align-items: center; gap: 8px; min-height: 20px; margin-bottom: 2px; color: var(--is-text); }
.alert .al-h b { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; }
.alert .go { height: 20px; padding: 0 9px; }
.alert p { margin: 0 4px 0 0; overflow-wrap: anywhere; }
/* Copy, at the end of the words: its circle mustn't make the line taller */
.alert p .tw { display: inline-flex; vertical-align: middle; margin: -3px 0 -3px 1px; }
.alert .tl { color: var(--is-dim); }
.alert .tl:hover { background: var(--is-fill); color: var(--is-text); }
.alert .tl.done { color: var(--ok); }
.notes { margin: 0; padding: 0 var(--pad) 2px; list-style: none; display: grid; gap: 5px; }
.notes li { position: relative; padding-left: 13px; }
.notes li::before { content: ""; position: absolute; left: 2px; top: 6px; width: 4px; height: 4px; border-radius: 50%; background: var(--is-faint); }
.lnks { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px var(--pad) 2px; }
.lnk { display: inline-flex; align-items: center; gap: 3px; padding: 0; border: 0; background: none; color: var(--is-dim); font: 500 11px/16px var(--sys); cursor: pointer; }
.lnk span { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 2px; }
.lnk:hover span { text-decoration-color: currentColor; }
.lnk svg { width: 10px; height: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; padding: 8px var(--pad); font-size: 11px; line-height: 15px; }
.kv b { color: var(--is-faint); font-weight: 500; }
.kv span { min-width: 0; color: var(--is-dim); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* Minimized: this file as one card, and on the window's ground next to it
   how many other files have agents at work, or a red ! when Figma stopped
   answering in one, and restore under Figma's close button (mini, 240 px); or
   only this file's state and restore (nano, 70 px, the narrowest window Figma
   allows). Figma's header keeps its icon's centre 24 px from the window's left
   edge, and its close button's 20 px from the right, at any width: the state
   stays under the icon, as in the full window, and restore under the button. */
.mini { display: flex; align-items: center; gap: 3px; }
.mini.enter { animation: pop .34s cubic-bezier(.2, .8, .2, 1) backwards; }
.mini .island { flex: 1; }
.mini .row { padding-right: var(--pad); }
.mini .tl { margin: 0 3px 0 4.5px; }  /* its drawing 14 px from the card */
.mini .mc { flex: none; height: 30px; min-width: 30px; display: grid; place-items: center; padding: 0 7px; border-radius: 7px; background: var(--is-bg); box-shadow: inset 0 0 0 1px var(--is-edge);
  color: var(--is-text); font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.mini .mc.alarm { padding: 0; background: color-mix(in srgb, var(--err) 16%, var(--is-bg)); }
.mini.nano.enter { animation: nano .34s cubic-bezier(.3, 1.35, .55, 1) backwards; }
.mini.nano .island { flex: none; width: 26px; margin-left: 5px; }  /* its centre 24 px from the window's edge */
.mini.nano { gap: 0; }
.mini.nano .tl { margin-left: auto; }
.mini.nano .row { padding: 0; }
.mini.nano .tg { padding: 0; justify-content: center; }
@keyframes nano { from { transform: scale(.7); opacity: 0; } }
.island.alarm { background: color-mix(in srgb, var(--err) 16%, var(--is-bg)); }
.island.alarm .row { background: transparent; }
.island.alarm .agent { --cut: color-mix(in srgb, var(--err) 16%, var(--is-bg)); }  /* a stopped badge's square */

/* A view comes in (glide()). The settings slide in from the right over the
   islands, which go a little to the left and fade, and slide back out to the
   right; the last line stays. Minimized or restored, the window changes its
   size about its bottom right corner, where the sandbox keeps it: the view sits
   in that corner as the window's other edges close in or open out, and what
   the window showed fades out there. The window's size follows frame by frame. */
#scroll { position: relative; }
.ghost { pointer-events: none; }
#scroll > .ghost { position: absolute; left: 0; right: 0; }
body.slide #scroll { flex: 1 1 auto; overflow: hidden; }
body.slide-fwd #app { animation: in-right .32s cubic-bezier(.3, .7, .2, 1) both; }
body.slide-fwd #scroll > .ghost { animation: out-left .32s cubic-bezier(.3, .7, .2, 1) both; }
body.slide-back #app { animation: in-left .32s cubic-bezier(.3, .7, .2, 1) both; }
body.slide-back #scroll > .ghost { animation: out-right .32s cubic-bezier(.3, .7, .2, 1) both; }
@keyframes in-right { from { transform: translateX(100%); } }
@keyframes out-left { to { transform: translateX(-30%); opacity: 0; } }
@keyframes in-left { from { transform: translateX(-30%); opacity: 0; } }
@keyframes out-right { to { transform: translateX(100%); } }
body.morph { position: fixed; top: 0; right: 0; bottom: 0; justify-content: flex-end; }
body.morph #scroll { flex: none; overflow: hidden; }
body.morph > :is(#scroll, #foot) { animation: appear .2s ease .06s backwards; }
body > .ghost { position: fixed; right: 0; bottom: 0; z-index: 5; display: flex; flex-direction: column; background: var(--win-bg); animation: gone .18s ease forwards; }
.ghost .g-scroll { flex: 0 1 auto; min-height: 0; margin: 6px 0 0 6px; overflow: hidden; scrollbar-gutter: stable; }
.ghost .g-scroll::-webkit-scrollbar { width: 6px; }
.ghost .g-end { height: 6px; }
.ghost .g-foot { flex: none; padding: 0 6px 6px; }
.ghost .g-foot:empty { display: none; }
@keyframes gone { to { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .slot.enter, .slot.enter > .island, .slot.leave, .island.opening :is(.fold, .panel, .chev) { animation: none; }
  .agent[data-agent], .act, .act .ib, .foot .skip, .tip, .tl, .tl .ic, .tl .ring circle, .sw, .sw::after { transition: none; }
  .mini.enter { animation: none; }
  .spin { animation-duration: 2.4s; }
  .px i { animation: none; opacity: .6; }
  .shim { animation: none; background: none; color: inherit; }
}
</style>
</head>
<body>
<div id="scroll"><div id="app"></div><div id="end"></div></div>
<div id="foot"></div>
<div id="rvtip" role="tooltip"></div>

<script>
const SERVER = "ws://localhost:8788/plugin";
let ws = null;
let reconnectTimer = null;
let identity = { fileKey: null, name: null, docSig: null, pluginVersion: null, caps: [] };

function sendHello() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try {
    ws.send(JSON.stringify({
      type: "hello", version: "2.1", plugin: identity.pluginVersion,
      fileKey: identity.fileKey, name: identity.name, docSig: identity.docSig,
      caps: identity.caps,  // what the sandbox can do beyond exec
      awake: awakeState(),
    }));
  } catch (e) {}
}

// A button's message to the bridge: stop, update-now, reload-all.
function send(msg) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  try { ws.send(JSON.stringify(msg)); } catch (e) {}
}

// ─── keep-awake ──────────────────────────────────────────────────────────
// Chromium throttles a Figma window that is in the background: its timers and
// Figma's own `documentchange` reports slow to about once a minute, so a loop
// of `await figma.loadFontAsync` stalls ~50 s per call and changes arrive long
// after the script ended. A page that plays sound is never throttled, so while
// agents work this window plays a 20 Hz tone at -66 dBFS: nobody hears it, and
// Chromium counts it as sound (a silent stream does not count). It plays
// while scripts run and stops AWAKE_IDLE_MS after the last one ends, because a
// playing page also keeps macOS from idle sleep, and it stops at once when the
// bridge goes away: it plays only while the bridge is up (tests/ui.test.js).
const AWAKE_IDLE_MS = 3 * 60 * 1000;
const AWAKE_SETTLE_MS = 250;  // until Chromium notices the sound and lifts throttling
const AWAKE_RESUME_MS = 500;  // a page not allowed to play sound never resumes — don't wait for it
let audio = null;
let awakeSince = 0;
let awakeTimer = null;
// Requests in the sandbox, until their answer: id -> when the tone stops at
// the latest should the answer never come, AWAKE_IDLE_MS after its time is up.
const running = new Map();

function awakeState() {
  if (!audio) return "off";
  return audio.state === "running" ? "on" : audio.state;
}

// When to stop the tone: AWAKE_IDLE_MS from now, or later while a request
// still runs.
function quietLater() {
  clearTimeout(awakeTimer);
  let until = Date.now() + AWAKE_IDLE_MS;
  for (const latest of running.values()) until = Math.max(until, latest);
  awakeTimer = setTimeout(hush, until - Date.now());
}

// Start (or keep) the tone for a request; resolves once the window has had
// time to wake up.
function wake(msg) {
  running.set(msg.id, Date.now() + (Number(msg.timeout) || 60) * 1000 + AWAKE_IDLE_MS);
  quietLater();
  try {
    if (!audio) {
      audio = new AudioContext();
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.frequency.value = 20;
      gain.gain.value = 0.0005;
      osc.connect(gain);
      gain.connect(audio.destination);
      osc.start();
    }
    if (audio.state === "running" && awakeSince) {
      const left = awakeSince + AWAKE_SETTLE_MS - Date.now();
      return left > 0 ? new Promise((r) => setTimeout(r, left)) : null;
    }
    const resumed = audio.resume().then(() => true, (e) => { log("[awake] " + e.message); return false; });
    const late = new Promise((r) => setTimeout(() => r(false), AWAKE_RESUME_MS));
    return Promise.race([resumed, late]).then((ok) => {
      if (!ok || audio.state !== "running") return null;  // no sound: run the script as is
      awakeSince = Date.now();
      return new Promise((r) => setTimeout(r, AWAKE_SETTLE_MS));
    });
  } catch (e) {
    log("[awake] " + e.message);
    return null;
  }
}

// Stop the tone: no script for AWAKE_IDLE_MS, or the bridge is gone.
function hush() {
  clearTimeout(awakeTimer);
  running.clear();
  if (audio) audio.suspend();
  awakeSince = 0;
}

// Hand a request from the bridge to the sandbox once the window is awake.
function toSandbox(msg) {
  const ready = wake(msg);
  const send = () => parent.postMessage({ pluginMessage: msg }, "*");
  if (ready) ready.then(send, send); else send();
}

// ─── sounds ──────────────────────────────────────────────────────────────
// Short, quiet cues: for what you press in the window, and when Figma stops
// answering in this window's own file, so that is heard once, not once per
// window. `open` is a rising sine sweep and `close` the same one falling; `layer`
// is a double click, like a mechanical switch, and the others are made of the same
// parts. A layer: its source (an oscillator's type and Hz, or
// a sweep [from, to], or white noise), a filter [type, Hz or a sweep, Q], when
// it starts (s), its envelope [attack, decay, release] (s) and its gain.
const CUES = {
  open: [{ src: "sine", hz: [440, 660], env: [0.002, 0.1, 0.03], gain: 0.4 }],       // an island opens
  close: [{ src: "sine", hz: [660, 440], env: [0.002, 0.1, 0.03], gain: 0.4 }],      // …and closes
  layer: [{ src: "noise", filter: ["highpass", 3500, 0.7], env: [0.0002, 0.006], gain: 0.34 },  // a layer, a link: a double click
          { src: "noise", filter: ["bandpass", 1600, 3], at: 0.014, env: [0.0002, 0.012], gain: 0.42 }],
  go: [{ src: "sine", hz: 330, env: [0.002, 0.045], gain: 0.36 },                     // Update, Reload: it starts

  out: '<svg viewBox="0 0 10 10"><path d="M2.4 7.6 7.4 2.6M3.6 2.6h3.8v3.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  FRAME: '<svg viewBox="0 0 12 12"><path d="M4 1.5v9M8 1.5v9M1.5 4h9M1.5 8h9" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>',
  COMPONENT: '<svg viewBox="0 0 12 12"><path fill="currentColor" d="M6 .9 7.7 2.6 6 4.3 4.3 2.6zM6 7.7l1.7 1.7L6 11.1 4.3 9.4zM2.6 4.3 4.3 6 2.6 7.7.9 6zM9.4 4.3 11.1 6 9.4 7.7 7.7 6z"/></svg>',
  INSTANCE: '<svg viewBox="0 0 12 12"><path d="M6 1.3 10.7 6 6 10.7 1.3 6z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
  TEXT: '<svg viewBox="0 0 12 12"><path d="M2.5 2.5h7M6 2.5v7.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
};
// An event or a request: a disc in its colour (.bdg.<kind>) with a white mark. Stopped's square
// is the island's own colour, cut out of a grey disc; the yellow one's "!" is dark on the dark theme.
const BADGE = {
  done: '<path d="M3.5 6.2 5.2 7.9 8.5 4.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
  failed: '<path d="M4.25 4.25 7.75 7.75M7.75 4.25 4.25 7.75" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>',
  stopped: '<rect x="3.5" y="3.5" width="5" height="5" rx="1.1" style="fill: var(--cut, var(--is-bg))"/>',
  alarm: '<path d="M6 3v3.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="8.75" r=".85" fill="#fff"/>',
  caution: '<path d="M6 3v3.4" fill="none" style="stroke: var(--is-warn-on)" stroke-width="1.4" stroke-linecap="round"/><circle cx="6" cy="8.75" r=".85" style="fill: var(--is-warn-on)"/>',
  update: '<path d="M6 2.9v4.3M4.1 5.4 6 7.3l1.9-1.9M4 9.1h4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>',
  build: '<path transform="translate(6 6) scale(.7) translate(-4.9 -4.85)" d="M8.6 5.9A3.75 3.75 0 1 1 7.8 2.3M8.6.9v2.1H6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  ask: '<path d="M4.55 4.7a1.5 1.5 0 1 1 2.2 1.3c-.5.27-.75.6-.75 1.1v.25" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="8.85" r=".85" fill="#fff"/>',
};
const badge = (kind) => `<span class="bdg ${kind}"><svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="6" fill="currentColor"/>${BADGE[kind]}</svg></span>`;

const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

// A layer's type icon; an unknown or odd type ("constructor") gets the frame's.
const iconOf = (type) => (Object.prototype.hasOwnProperty.call(ICON, type) && typeof ICON[type] === "string" ? ICON[type] : ICON.FRAME);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function color(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function ago(ts) {
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 45) return "now";
  const m = Math.round(s / 60);
  return m < 60 ? m + "m" : Math.round(m / 60) + "h";
}
const agoLong = (ts) => { const a = ago(ts); return a === "now" ? "just now" : a + " ago"; };
function clock(ts) {
  const s = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
const clockSpan = (ts) => `<span data-clock="${ts}">${clock(ts)}</span>`;
const agoSpan = (ts) => `<span data-ago="${ts}" data-long="1">${agoLong(ts)}</span>`;
const agoShort = (ts) => `<span data-ago="${ts}">${ago(ts)}</span>`;
// The first letter, or the whole emoji: a name may start with one.
const av = (name) => `<span class="av" style="--av: ${color(name)}">${esc((Array.from(String(name))[0] || "?").toUpperCase())}</span>`;

// What a closed island shows: the file, then what matters most in it. An agent that
// wants comments with no token to read them says so there too.
function headline(f) {
  const h = headlineOf(f);
  return f.ask && board && board.figma && (!board.figma.token || board.figma.rejected) && !h.alarm && h.kind !== "connecting" && h.kind !== "nobridge"
    ? Object.assign({}, h, { sub: esc(f.ask.agent) + " wants to read comments" }) : h;
}
function headlineOf(f) {
  if (f.here && conn === "connecting") return { kind: "connecting", ind: '<span class="spin idle"></span>', sub: "connecting…" };
  if (f.here && conn === "nobridge") return { kind: "nobridge", ind: '<span class="dot idle"></span>', sub: "no bridge yet" };
  if (alarm(f)) return { kind: "alarm", ind: badge("alarm"), sub: "Figma isn't answering", alarm: true };
  const list = agentsOf(f);
  const rv = rvOf(f);
  if (rv && rv.state === "notes" && rv.notes.length) {
    return { kind: "notes", ind: badge("caution"), sub: "reviewer: " + plural(rv.notes.length, "note", "notes") + " for you" };
  }
  const working = list.filter((a) => a.st === "working");
  if (working.length) {
    const sub = working.length > 1 ? working.map((a) => esc(a.name)).join(", ") : esc(working[0].name) + " " + clockSpan(working[0].since);
    return { kind: "working", ind: LOADER, sub };
  }
  const failed = list.find((a) => a.st === "failed");
  if (failed) return { kind: "failed", ind: badge("failed"), sub: esc(failed.name) + " failed" };
  const done = list.find((a) => a.st === "done");
  if (done) return { kind: "done", ind: badge("done"), sub: esc(done.name) + " is done" };
  const stopped = list.find((a) => a.st === "stopped");
  if (stopped) return { kind: "stopped", ind: badge("stopped"), sub: esc(stopped.name) + " stopped" };
  const last = f.recent[0];
  if (!last) return { kind: "ok", ind: '<span class="dot"></span>', sub: "" };
  return { kind: "ok", ind: '<span class="dot"></span>', sub: esc(last.agent) + " · " + agoSpan(last.at) };
}

// An open island lists everything below its row, so the row keeps only the file's name.
function row(f) {
  const h = headline(f);
  const isOpen = open.has(f.id);
  const right = `<button type="button" class="chev" data-act="toggle" aria-label="${isOpen ? "Collapse" : "Expand"}" tabindex="-1">${ICON.chev}</button>`;
  const sub = h.sub && !isOpen ? `<span class="sub${h.alarm ? " alarm" : ""}">${h.sub}</span>` : "";
  return `<div class="row"><button type="button" class="tg" data-act="toggle" aria-expanded="${isOpen}">`
    + `<span class="ind">${h.ind}</span><span class="lbl"><b title="${esc(f.name)}">${esc(f.name)}</b>${sub}</span></button>`
    + `<div class="right">${right}</div></div>`;
}

function callout(f) {
  const h = headline(f);
  if (h.kind === "connecting") return `<div class="callout"><div class="h"><span class="ind">${h.ind}</span>Looking for the bridge</div><p>It runs on this computer and answers in a second or two.</p></div>`;
  if (h.kind === "nobridge") return `<div class="callout"><div class="h"><span class="ind">${h.ind}</span>Waiting for the bridge</div><p>It starts with your agent's first figaro command. To start it now, run <code>figaro doctor</code> in a terminal.</p></div>`;
  if (h.kind === "alarm") {
    // Still running past its deadline, or its window closed meanwhile: either
    // way only a fresh start of the file brings Figaro back there.
    const why = f.stuck
      ? `A script by ${esc(f.stuck.agent)} is still running: its time ran out ${agoSpan(f.stuck.since)}.`
      : `Figaro's window there closed while a script by ${esc(f.lost.agent)} was running, ${agoSpan(f.lost.at)}.`;
    return `<div class="callout alarm"><div class="h"><span class="ind">${h.ind}</span>Figma isn't answering</div><p>${why}</p>`
      + `<p>Reload ${f.here ? "this file" : "the file"} in Figma: close its tab and open it again, or quit Figma if the tab won't close. Then run Figaro in it.</p></div>`;
  }
  // An agent asked for comments, and the designer hasn't given Figaro a token: not now, or add one
  // (the main button goes last, on the right, as in Figma's own dialogs).
  if (f.ask && board && board.figma && (!board.figma.token || board.figma.rejected)) {
    return `<div class="callout ask"><div class="h"><span class="ind">${badge("ask")}</span>${esc(f.ask.agent)} wants to read comments</div>`
      + "<p>Figma shows comments only to an app with your token. Add one in the settings, and your agent can go on.</p>"
      + '<div class="acts"><button type="button" class="go2" data-act="ask-hide">Not now</button>'
      + '<button type="button" class="go" data-act="ask-add">Add a Figma token</button></div></div>';
  }
  return "";
}

// An agent's row: what it is doing. One at work has its Stop, shown while the
// pointer is on the row (hot) and while the Stop is under way (held); another
// file's agents can be stopped too, as the bridge knows them all. The error
// of an agent's last script stays under its name, at work or not, until a
// script of its succeeds: Recent says "Script failed" meanwhile.
function agentRow(f, a) {
  let st, act = "", msg = "", cls = "agent", data = "";
  const err = a.error ? `<p class="msg err">${a.error.line ? `Line ${a.error.line}: ` : ""}${esc(a.error.text)}</p>` : "";
  if (a.st === "working") {
    st = `${LOADER}<span><span class="shim">working</span> ${clockSpan(a.since)}</span>`;
    msg = err;
    if (f.doc) {
      const pressed = stopping.has(f.doc + "\n" + a.name);
      const tip = pressed ? "Stopping…" : "Stop " + a.name;
      act = `<span class="act"><button type="button" class="ib" data-act="stop" data-agent="${esc(a.name)}" title="${esc(tip)}" aria-label="${esc(tip)}"${pressed ? " disabled" : ""}><span class="sq"></span></button></span>`;
      data = ` data-agent="${esc(a.name)}"`;
      if (pressed) cls += " held";
      if (hot === f.id + "\n" + a.name) cls += " hot";
    }
  } else if (a.st === "done") {
    st = `${badge("done")}done · ${agoShort(a.at)}`;
    if (a.done.text) msg = `<p class="msg">${esc(a.done.text)}</p>`;
  } else if (a.st === "stopped") {
    st = badge("stopped") + "stopped by you";
  } else if (a.st === "failed") {
    st = `${badge("failed")}failed · ${agoShort(a.at)}`;
    msg = err;
  } else {
    st = `idle · ${agoShort(a.at)}`;
  }
  return `<div class="${cls}"${data}><div class="ah">${av(a.name)}<span class="nm">${esc(a.name)}</span><span class="st">${st}</span>${act}</div>${msg}</div>`;
}

// Layers of this file are buttons that select and zoom; another file's are only names.
function event(e, here) {
  const chips = (e.layers || []).map((l) => {
    const type = l.type === "COMPONENT_SET" ? "COMPONENT" : l.type;
    const gone = here && goneLayers.has(l.id);
    const cls = "layer" + (type === "COMPONENT" || type === "INSTANCE" ? " comp" : "") + (gone ? " gone" : "");
    const inner = `${iconOf(type)}<span>${esc(l.name)}</span>`;
    return here ? `<button type="button" class="${cls}" data-act="layer" data-id="${esc(l.id)}" title="${gone ? "Not in the file any more" : "Select it in Figma"}">${inner}</button>`
      : `<span class="${cls}">${inner}</span>`;
  }).join("") + (e.more ? `<span class="more">+${e.more}</span>` : "");
  const note = e.note ? ` <em>· ${esc(e.note)}</em>` : "";
  return `<div class="ev${e.kind === "err" ? " err" : e.kind === "stop" ? " stop" : ""}"><span class="t" data-ago="${e.at}">${ago(e.at)}</span>`
    + `<span class="s"><em>${esc(e.agent)}</em> <b>${esc(e.summary)}</b>${note}</span>`
    + (chips ? `<div class="layers">${chips}</div>` : "") + "</div>";
}

const LENS = '<svg viewBox="0 0 12 12"><circle cx="5.2" cy="5.2" r="3.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.7 7.7 10.4 10.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const QM = '<svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="5.2" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M4.65 4.7a1.4 1.4 0 1 1 2 1.25c-.42.22-.65.52-.65.98v.22" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><circle cx="6" cy="8.75" r=".62" fill="currentColor"/></svg>';
const RV_HINT = "Checks what agents change when they're done: colours and text styles, names, contrast. Turn it on before they start.";
// The reviewer's row, the last of the agents: a switch for this file when it is idle, a Stop while it checks.
function reviewerRow(f, r) {
  const checking = r.state === "checking";
  const avatar = r.state === "off" ? `<span class="av ghost rvi">${LENS}</span>` : `<span class="av rvi" style="--av: ${color("reviewer")}">${LENS}</span>`;
  const n = r.notes.length;
  const st = checking ? `${LOADER}<span><span class="shim">checking</span>${r.layers ? " " + plural(r.layers, "layer", "layers") : ""}</span>`
    : r.state === "off" ? "off" : r.state === "waiting" ? "waits for agents"
    : r.state === "notes" ? `${badge("caution")}${plural(n, "note", "notes")} for you`
    : r.state === "sent" ? (r.sent ? "sent " + plural(r.sent, "fix", "fixes") : "all fine") + (r.sent && r.left ? ` · ${r.left} left as is` : "")
    : r.state === "good" ? `${badge("done")}all good${r.layers ? " · " + plural(r.layers, "layer", "layers") : ""}` : "";
  let cls = "agent rv", data = "", right;
  if (checking) {
    const pressed = stopping.has(f.doc + "\nreviewer");
    const tip = pressed ? "Stopping…" : "Stop reviewer";
    right = `<span class="act"><button type="button" class="ib" data-act="stop" data-agent="reviewer" title="${tip}" aria-label="${tip}"${pressed ? " disabled" : ""}><span class="sq"></span></button></span>`;
    data = ' data-agent="reviewer"';
    if (pressed) cls += " held";
    if (hot === f.id + "\nreviewer") cls += " hot";
  } else {
    // like Stop on the others: shown while the pointer is on the row, or the keyboard is in it
    const on = r.state !== "off";
    right = `<span class="act swa"><button type="button" class="sw${on ? " on" : ""}" role="switch" aria-checked="${on}" aria-label="Reviewer" data-act="rv-toggle" data-on="${on ? "" : "1"}"></button></span>`;
    data = ' data-agent="reviewer"';
    if (hot === f.id + "\nreviewer") cls += " hot";
  }
  return `<div class="${cls}"${data}><div class="ah">${avatar}<span class="nm rvn"><span>reviewer</span><span class="qm" data-hint="1">${QM}</span></span>`
    + `<span class="st">${st}</span>${right}</div></div>`;
}

// Its notes for the designer: which of them the agent should fix. All come ticked.
function reviewerAsk(f, r) {
  if (r.state !== "notes" || !r.notes.length) return "";
  const picked = rvTicked(f, r);
  const who = r.agent || "the agent";
  const items = r.notes.map((nt) => {
    const on = picked.includes(nt);
    const chips = nt.layers.map((l) => {
      const type = l.type === "COMPONENT_SET" ? "COMPONENT" : l.type;
      const gone = f.here && goneLayers.has(l.id);
      const cls = "layer" + (type === "COMPONENT" || type === "INSTANCE" ? " comp" : "") + (gone ? " gone" : "");
      const inner = `${iconOf(type)}<span>${esc(l.name)}</span>`;
      return f.here ? `<button type="button" class="${cls}" data-act="layer" data-id="${esc(l.id)}" title="${gone ? "Not in the file any more" : "Select it in Figma"}">${inner}</button>` : `<span class="${cls}">${inner}</span>`;
    }).join("") + (nt.more ? `<span class="more">+${nt.more}</span>` : "");
    return `<li class="${on ? "on" : ""}"><button type="button" class="cb" data-act="rv-tick" data-id="${esc(nt.id)}" role="checkbox" aria-checked="${on}" aria-label="${esc(nt.title)}">${on ? ICON.done : ""}</button>`
      + `<div><b>${esc(nt.title)}</b>${nt.text ? ` <em>· ${esc(nt.text)}</em>` : ""}${chips ? `<div class="layers">${chips}</div>` : ""}</div></li>`;
  }).join("");
  const text = r.expired ? `${esc(who)} has finished. Copy the ones to fix into its chat.` : `Tick the ones ${esc(who)} should fix. It waits for your answer.`;
  const k = picked.length;
  const main = r.expired
    ? `<button type="button" class="go" data-act="rv-copy"${k ? "" : " disabled"}>Copy for chat</button>`
    : `<button type="button" class="go" data-act="rv-send"${k ? "" : " disabled"}>Send ${k} to ${esc(who)}</button>`;
  const alive = r.notes.some((nt) => nt.layers.some((l) => !goneLayers.has(l.id)));
  const all = f.here && alive ? '<button type="button" class="showall" data-act="rv-all">Show all</button>' : "";
  return `<div class="callout rq"><div class="h">${plural(r.notes.length, "note", "notes")} on ${esc(who)}'s work${all}</div>`
    + `<p>${text}</p><ul class="rql">${items}</ul><div class="acts"><button type="button" class="go2" data-act="rv-fine">All fine</button>${main}</div></div>`;
}

// The ticked notes as `figaro notes` prints them for an agent, with a link to each layer.
function reviewerText(f, r) {
  const picked = rvTicked(f, r), who = r.agent || "the agent";
  const slug = String(f.name || "").replace(/[^A-Za-z0-9]+/g, "-") || "Untitled";
  const link = (id) => (f.sig ? `https://www.figma.com/design/${f.sig}/${slug}?node-id=${encodeURIComponent(String(id).replace(/:/g, "-"))}` : "");
  const lines = [`The reviewer's notes on ${who}'s work in ${f.name}:`, ""];
  picked.forEach((nt, i) => {
    const head = `${i + 1}. `, pad = " ".repeat(head.length);
    const known = new Map([...nt.names, ...nt.layers.map((l) => [l.id, l])]);
    const one = (id) => { const l = known.get(id); return l ? `"${l.name}" (${l.type}) ${id}` : id; };
    if (nt.details.length) {
      lines.push(`${head}${nt.title}: ${nt.text}`);
      for (const d of nt.details) {
        lines.push(`${pad}- ${d.text}`);
        for (const id of d.layers) lines.push(`${pad}  ${one(id)}` + (link(id) ? "  " + link(id) : ""));
      }
      if (nt.detailsMore) lines.push(`${pad}  and ${plural(nt.detailsMore, "more line", "more lines")} like these`);
    } else {
      lines.push(`${head}${nt.title}: ${nt.text}`);
      for (const l of nt.layers) lines.push(`${pad}${one(l.id)}` + (link(l.id) ? "  " + link(l.id) : ""));
      if (nt.more) lines.push(`${pad}and ${plural(nt.more, "more layer", "more layers")}`);
    }
  });
  lines.push("", `Fix ${picked.length === 1 ? "this one" : "these"}, then run figaro done again.`);
  return lines.join("\n");
}

function panel(f) {
  const on = conn === "ok";
  const list = on ? agentsOf(f) : [];
  const rv = on ? rvOf(f) : null;
  const feed = on && recentShown() ? f.recent.slice(0, 5) : [];
  const note = callout(f);
  // No agent at work: the Agents section is there all the same, with a ghost of
  // an agent's row. Changes left from agents who went are no reason to drop it.
  const empty = on && !note && !list.length
    ? '<div class="agent empty"><div class="ah"><span class="av ghost"></span>'
      + `<span class="nm">${f.recent.length ? "No agents at work" : "No agents yet"}</span></div>`
      + `<p class="msg">Give an agent a link to ${f.here ? "this" : "the"} file:<br>its work shows up here.</p></div>` : "";
  return '<div class="panel">' + note + (empty || list.length || rv ? '<div class="sect">Agents</div>' : "") + empty
    + list.map((a) => agentRow(f, a)).join("") + (rv ? reviewerRow(f, rv) + reviewerAsk(f, rv) : "")
    + (feed.length ? '<div class="sect">Recent</div><div class="feed">' + feed.map((e) => event(e, f.here)).join("") + "</div>" : "")
    + "</div>";
}

// An island that opens or closes keeps its panel in a fold that grows from
// nothing or shrinks back to it (the CSS above).
function island(f, cls, anim) {
  const isOpen = open.has(f.id);
  const shut = !isOpen && closing.has(f.id);
  const state = isOpen ? " open" + (anim ? " opening" : "") : shut ? " closing" : "";
  return `<div class="slot${cls}" data-fid="${esc(f.id)}"><div class="island${state}">${row(f)}`
    + (isOpen || shut ? `<div class="fold"><div>${panel(f)}</div></div>` : "") + "</div></div>";
}

// ─── the window's views ──────────────────────────────────────────────────
// The files (the islands), the settings, and two minimized views: mini, 240 px,
// the file that matters most, and nano, 70 px, only its state. A minimized
// window keeps its corner under Figma's close button (code.js), and its view
// when the plugin runs in that file again: the sandbox keeps it and says it in
// `identity`.
const WIDTHS = { files: 320, settings: 320, mini: 240, nano: 70 };
const REPO = "https://github.com/artem-levchenko-2/figaro";
let view = "files";
let viewSince = 0;
let viewTaken = false;         // the sandbox's view, taken once it has read it
let checkAsked = 0;            // when ↻ was pressed: it turns until the board says the bridge looked
// The page takes the view's width at once. Measured at the old one (nano's 70 px,
// before the sandbox has widened the window), the islands would wrap and ask for
// far more height than they take, and the window would jump up to make room.
function layWidth() {
  if (document.body && document.body.style) document.body.style.width = WIDTHS[view] + "px";
}
function setView(next) {
  if (next === view || !WIDTHS[next]) return;
  endGlide(false);
  const was = view, w0 = window.innerWidth || WIDTHS[was], h0 = window.innerHeight;
  const ghost = ghostOf(was, next);
  view = next;
  layWidth();
  viewSince = Date.now();
  parent.postMessage({ pluginMessage: { type: "view", view: next === "mini" || next === "nano" ? next : "files" } }, "*");
  if (ghost) glide = { ghost, t0: 0 };  // the window asks for its size once the view is drawn
  finishDrive();
  closing.clear();
  animId = shutId = null;
  onScreen.clear();            // the islands come back as they were, without coming in
  ready = false;
  lastHtml = lastFoot = null;
  render();
  if (ghost) startGlide(was, next, w0, h0);
}

// A view comes in (the CSS above): what the window showed stays on as a ghost
// while the window glides to its new size, a frame at a time as an island's
// drive does. Minimized or restored, the sandbox keeps the window's bottom

  g.className = "ghost";
  g.setAttribute("aria-hidden", "true");

    g.innerHTML = app.innerHTML;
    g.style.top = -scroller.scrollTop + "px";
    scroller.insertBefore(g, app);
  } else {  // minimized or restored: the whole window as it was
    g.innerHTML = `<div class="g-scroll">${app.innerHTML}<div class="g-end"></div></div><div class="g-foot">${foot.innerHTML}</div>`;
    g.style.width = (window.innerWidth || WIDTHS[was]) + "px";
    g.style.height = window.innerHeight + "px";
    document.body.appendChild(g);
    g.firstChild.scrollTop = scroller.scrollTop;

}
function startGlide(was, next, w0, h0) {
  const g = glide;
  if (!g) return;
  scroller.scrollTop = 0;
  const corner = WIDTHS[was] !== WIDTHS[next];
  // as tall as the view is at its own width (layWidth), before it is put in the corner
  const h1 = Math.max(1, Math.min(Math.ceil(contentHeight()), roomHeight, HEIGHT_MAX));
  Object.assign(g, { corner, w0, h0, w1: WIDTHS[next], h1, t0: performance.now(), sent: "", done: 0 });
  document.body.classList.add(corner ? "morph" : "slide");
  if (!corner) document.body.classList.add(next === "settings" ? "slide-fwd" : "slide-back");
  stepGlide(g.t0);
  const tick = (now) => { if (glide === g) { stepGlide(now); requestAnimationFrame(tick); } };
  requestAnimationFrame(tick);

  g.last = now;
  const t = Math.min(1, g.done / GLIDE.ms), e = GLIDE.ease(t);
  const height = Math.round(g.h0 + (g.h1 - g.h0) * e), width = Math.round(g.w0 + (g.w1 - g.w0) * e);

    g.sent = width + "x" + height;
    sentHeight = height;
    sentWidth = width;

  placeTips();  // the window's width came after the view's: from nano, Minimize's hint would hang off its edge
  if (fitAfter) fit(true);
}

// What there is to do about the Figaro version, for the last line and the settings.
// A release the user skipped stays off the last line until a newer one comes out:
// the bridge keeps the skip for every window and names it on the board
// (`board.skipped`), and this window keeps its own (`skipped`) for a bridge too
// old to know Skip.
let skipped = null;
function versionNow() {
  const on = conn === "ok";
  const latest = (on && ((board && board.update && board.update.latest) || (update && update.latest))) || "";
  const release = (on && !latest && board && board.release) || null;  // newer, and the bridge has no Update button
  const doing = (on && board && board.updating) || null;
  let failed = (on && !doing && board && board.failed) || null;
  const newer = latest || (release && release.latest) || "";
  const gone = skipped || (board && board.skipped) || "";
  const away = !!newer && newer === gone;
  // An update that failed is about its release: skipped, or a newer one out,
  // it is nothing to show any more (a bridge before 1.5.0 doesn't name it).
  if (failed && failed.what === "update" && (away || (failed.to ? failed.to !== newer : !!gone && !newer))) failed = null;
  let doingText = "";
  if (doing) {
    const reloading = doing.what === "reload";
    doingText = doing.step === "wait" ? (reloading ? "Reloads once the scripts finish" : "Updates once the scripts finish")
      : doing.step === "pull" ? `Updating to ${esc(doing.to || latest || "the new version")}…`
      : reloading ? "Reloading Figaro…" : "Restarting Figaro…";

// The newest release the bridge knows, skipped or not, for the settings:

// while it offers it.
function newestNow(v) {
  const n = v.on && board && board.newest;
